<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" href="/favicon.ico" sizes="32x32" />
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <meta name="color-scheme" content="light dark" />
        <title>Riassunti SSE</title>
        <script>
            (() =>
            {
                // Applica subito il tema del browser, prima del caricamento dell'app, per evitare flash.
                const query = window.matchMedia("(prefers-color-scheme: dark)");
                const apply = () => document.documentElement.setAttribute("data-bs-theme", query.matches ? "dark" : "light");

                apply();
                query.addEventListener("change", apply);
            })();
        </script>
    </head>
    <body>
        <noscript>
            <strong>
                We're sorry but this application doesn't work properly without JavaScript enabled.<br />
                Please enable it to continue.
            </strong>
        </noscript>
        <div id="app"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
