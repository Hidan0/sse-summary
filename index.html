<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" href="/favicon.ico" sizes="32x32" />
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <meta name="color-scheme" content="light dark" />
        <title>Riassunti SSE</title>
        <script>
            (() =>
            {
                // Applica subito il tema, prima del caricamento dell'app, per evitare flash: quello scelto
                // a mano (vedi `src/composables/tema.ts`) oppure quello del sistema.
                let scelta = null;
                try { scelta = localStorage.getItem("sse-tema"); }
                catch { /* localStorage non disponibile: si segue il sistema. */ }

                const scuro = (scelta === "dark") || ((scelta !== "light") && window.matchMedia("(prefers-color-scheme: dark)").matches);
                document.documentElement.setAttribute("data-bs-theme", scuro ? "dark" : "light");
            })();
        </script>
    </head>
    <body>
        <noscript>
            <strong>
                We're sorry but this application doesn't work properly without JavaScript enabled.<br />
                Please enable it to continue.
            </strong>
        </noscript>
        <div id="app"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
