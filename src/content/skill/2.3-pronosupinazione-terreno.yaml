# Scheda skill del corso SSE, riportata parola per parola (vedi CLAUDE.md, regola 2).
titolo: Pronosupinazione su terreno senza presidi
intestazione: SKILL 03_PRONOSUPINAZIONE
sottotitolo: (su TERRENO senza presidi)
gruppo: trauma
fonte: skill-pronosupinazione
revisione: Rev.1 del 6/4/2017
riassunti: [immobilizzazione-atraumatica]

colonne: ["Linee guida per l'esecuzione"]
avvertenza: (in neretto le indicazioni per l’allievo)
passi:
  - Fa immobilizzare manualmente il capo, in posizione già pronta per la rotazione al 1° soccorritore, si presenta al paziente, gli spiega la manovra (2° soccorritore)
  - Allinea gli arti superiori lungo l’asse del corpo e gli arti inferiori avvicinandoli tra loro senza effettuare rotazioni o trazioni anomale
  - Si inginocchia a lato del paziente posiziona le mani all’altezza della spalla e del bacino contenendo il polso del paziente
  - Il 3° soccorritore si posiziona a lato del paziente, con la mano a livello del torace incrociando il braccio con quello del 2° soccorritore e l’altra mano a livello del femore poco sopra l’articolazione del ginocchio
  - Il 1° soccorritore (alla testa) dà il via alla manovra di rotazione del paziente di 90° gradi (sul fianco); la testa va portata in posizione neutra
  - Il 2° soccorritore cambia orientamento delle mani; sposta la mano dalla spalla al centro del dorso posteriormente e la mano dal bacino lungo il tronco anteriormente
  - Il 3° soccorritore cambia orientamento delle mani; sposta la mano dal torace al centro del tratto lombo-sacrale posteriormente e la mano sul femore lungo il bacino anteriormente
  - Al via del 1° soccorritore si porta il paziente in posizione supina mantenendo la colonna vertebrale allineata

errori:
  - "Non immobilizza la testa"
  - "Movimento di rotazione della colonna non sincronizzato"
  - "Posizione delle mani errata"
