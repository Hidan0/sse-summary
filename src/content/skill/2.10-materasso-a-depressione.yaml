# Scheda skill del corso SSE, riportata parola per parola (vedi CLAUDE.md, regola 2).
titolo: Materasso a depressione
intestazione: SKILL 10_MATERASSO a DEPRESSIONE
sottotitolo: (Manovra a TRE Soccorritori)
gruppo: trauma
fonte: skill-materasso
revisione: Rev.1 del 6/4/2017
riassunti: [immobilizzazione-atraumatica, tecniche-di-immobilizzazione-di-base]

colonne: ["Linee guida per l'esecuzione"]
passi:
  - Stende il materassino al suolo facendo attenzione agli oggetti taglienti
  - Distribuisce uniformemente le palline di polistirolo al suo interno eliminando le pieghe della tela
  - Solleva il paziente con la barella a cucchiaio, coordinando l’équipe
  - Depone il paziente sul materassino con la testa allineata al bordo superiore
  - Toglie le valve della barella a cucchiaio mantenendo la stabilità del rachide
  - Modella il materassino ai lati della testa, del tronco e degli arti, inserisce eventuale spessore tra i due arti inferiori
  - Fa attivare la depressione del materassino e fissa le cinghie laterali
  - Mentre si irrigidisce, modella ulteriormente il materassino intorno al paziente facendo attenzione di non coprire il volto
  - Verifica la raggiunta rigidità del materassino e la tenuta della valvola di aspirazione
  - Solleva il paziente stando ai lati *(ideale quattro soccorritori)* e lo trasporta sulla barella a cucchiaio coordinando l’équipe.
  - Posiziona il paziente nel materasso a depressione sopra la tavola “a cucchiaio” per il trasporto fino alla barella.
  - Fissa il paziente e il materassino alla barella portantina

errori:
  - "Non immobilizza la testa"
  - "Non sincronizza gli spostamenti"
  - "Non controlla l'aderenza del materasso durante la depressione"
consigli: []
