# Scheda skill del corso SSE, riportata parola per parola (vedi CLAUDE.md, regola 2).
titolo: Barella a cucchiaio
intestazione: SKILL 11_BARELLA “A CUCCHIAIO”
sottotitolo: (Manovra a TRE Soccorritori)
gruppo: trauma
fonte: skill-cucchiaio
revisione: Rev.1 del 6/4/2017
riassunti: [immobilizzazione-atraumatica, tecniche-di-immobilizzazione-di-base]

colonne: ["Linee guida per l'esecuzione"]
passi:
  - Fa immobilizzare il capo del paziente in posizione neutra
  - Chiama il paziente, si presenta e spiega la manovra
  - Applica il collare cervicale adatto, previa valutazione del collo, fa mantenere l’immobilizzazione manuale al 2° soccorritore
  - Posiziona la barella al lato del paziente e regola la lunghezza
  - Blocca correttamente la barella alla lunghezza adatta, apre le cerniere separando le due emivalve
  - Posiziona le due emivalve ai lati del paziente (facendo attenzione a non passare sopra al corpo del paziente)
  - Fa posizionare il 3° soccorritore si pone a lato del paziente, il quale afferra con una mano la spalla e con l’altra il bacino e l’estremità dell’arto inferiore, solleva quanto basta per far inserire l’emivalva della cucchiaio
  - Infila ciascuna emivalva sotto al paziente
  - Il 1° e il 3° soccorritore agganciano prima la cerniera superiore e poi quella inferiore
  - Verifica la tenuta delle cerniere
  - Controlla il mantenimento dell’immobilizzazione manuale del capo durante le tutte le manovre
  - Trasporta sulla tavola spinale o materasso a depressione

