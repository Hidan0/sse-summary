# Scheda skill del corso SSE, riportata parola per parola (vedi CLAUDE.md, regola 2).
titolo: BLSD nell'adulto
intestazione: SKILL 01_BLSD ADULTO
gruppo: blsd
fonte: blsd-skill
revisione: Rev.1 del 6/4/2017
riassunti: [blsd, defibrillatore-dae]

colonne: ["Linee guida per l'esecuzione", "Indicazioni per l'allievo"]
passi:
  - ["Valuta la scena", "Scena sicura, valuta se ambiente idoneo all’uso del DAE"]
  - ["Chiama il paziente, valuta presenza e qualità del respiro", "NON risponde, NON respira (o respiro anormale compatibile con ACC)"]
  - ["Posiziona la persona supina, Inizia o fa iniziare le CTE", "Individua il punto corretto di compressione ed esegue CTE fino a DAE pronto (conta ad alta voce)"]
  - ["Chiede DAE, allerta o fa allertare SOREU", "Fa applicare il DAE e chiama o fa chiamare la soreu"]
  - ["Prepara il DAE e il torace", "Accende il DAE, scopre il torace quanto basta, rade e asciuga se necessario"]
  - ["Applica gli elettrodi (non interrompendo CTE)", "Applica gli elettrodi nella posizione corretta"]
  - ["Allontana i presenti, **garantisce sicurezza** per tutti durante l’analisi e la carica del DAE", "Allontana i presenti e l’O₂, introduce il connettore e pronuncia la filastrocca durante l’analisi, si prepara con la mano sul tasto di erogazione"]
  - ["Eroga shock (se consigliato)", "Eroga lo shock in sicurezza, mantiene il controllo visiva sulla scena"]
  - ["Riprende (o fa riprendere) immediatamente CTE", "Esegue CTE (valutare tecnica ed efficacia)"]
  - ["Apre le vie aeree, ispeziona la cavità orale e posiziona la cannula orofaringea (*opzionale*)", "Estende il capo, solleva il mento, rimuove eventuali corpi estranei evidenti"]
  - ["Effettua 2 lente ventilazioni con pallone autoespansibile + reservoir collegati ad O₂ ad alti flussi", "Valutare correttezza della manovra (1 secondo per ognuna) ed efficacia (espansione del torace)"]
  - ["Prosegue con RCP 30:2 **efficace** con O₂, fino alla successiva analisi del DAE", "Ad ogni analisi interrompe RCP esegue il cambio per le CTE"]
  - ["Riconosce e risolve i messaggi di allarme/malfunzione del DAE", "Continua con RCP e rimuove la causa se possibile"]

errori:
  - "Ventilazioni inefficaci"
  - "CTE inefficaci"
  - "Interruzioni ingiustificate delle CTE"
  - "Mancata sicurezza"
  - "Posizione delle piastre inefficace"
  - "Non gestisce il malfunzionamento del DAE"
consigli:
  - >-
    Mettiti alla **sinistra** del paziente: sarà più facile applicare la piastra sulla linea ascellare media.
  - >-
    Durante l'analisi del DAE **non toccare né muovere** il paziente o il DAE.
