# Scheda skill del corso SSE, riportata parola per parola (vedi CLAUDE.md, regola 2).
titolo: Pronosupinazione su tavola spinale spessa
intestazione: SKILL 04_PRONOSUPINAZIONE SU TAVOLA SPINALE (spessa)
sottotitolo: (Manovra a TRE Soccorritori)
gruppo: trauma
fonte: skill-pronosupinazione-spessa
revisione: Rev.1 del 6/4/2017
riassunti: [immobilizzazione-atraumatica]

colonne: ["Linee guida per l'esecuzione"]
passi:
  - Fa immobilizzare manualmente il capo, in posizione già pronta per la rotazione
  - Si presenta al paziente e gli spiega la manovra
  - Allinea gli arti del paziente lungo l’asse del corpo
  - Fa posizionare la tavola spinale a lato del paziente (lato opposto dello sguardo)
  - Si inginocchia a lato del paziente, con un ginocchio sopra la tavola spinale e posiziona le mani all’altezza della spalla e del bacino (contenendo il braccio del paziente in modo che non rimanga mobile)
  - Fa posizionare il 3° soccorritore a lato del paziente, con un ginocchio sopra la tavola spinale con le mani a livello del costato e del femore (in prossimità del ginocchio)
  - Al via del soccorritore alla testa, si ruota il paziente di 90° gradi; la testa va portata in posizione neutra
  - Il 2° e il 3° Soccorritore spostano il ginocchio dalla tavola spinale, il 2° soccorritore la solleva facendola aderire alla schiena del paziente effettua il cambio mani, a seguire il 3° soccorritore esegue la stessa manovra
  - Al via del soccorritore alla testa, si ruota il paziente e la tavola spinale in posizione supina
  - Il soccorritore alla testa comunica la necessità di centrare il paziente sulla spinale
  - Se necessario i soccorritori si posizionano a lato (o a cavalcioni) del paziente, lo afferrano all’altezza delle spalle e del bacino,
  - Al via del soccorritore alla testa, si centra il paziente sulla tavola spinale

errori:
  - "Non immobilizza la testa"
  - "Movimento di rotazione della colonna non sincronizzato"
  - "Posizione delle mani errata"
consigli: []
