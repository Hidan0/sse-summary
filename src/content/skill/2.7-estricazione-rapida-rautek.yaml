# Scheda skill del corso SSE, riportata parola per parola (vedi CLAUDE.md, regola 2).
titolo: Estricazione rapida (manovra di Rautek)
intestazione: SKILL 07_ESTRICAZIONE RAPIDA (RAUTEK)
sottotitolo: (Manovra a1/2 Soccorritori pericolo ambientale imminente)
gruppo: trauma
fonte: skill-rautek
revisione: Rev.1 del 6/4/2017
riassunti: [paziente-incastrato]

colonne: ["Linee guida per l'esecuzione"]
passi:
  - Valuta la scena e il numero di soccorritori per effettuare la manovra
  - Cerca la collaborazione del paziente, spiegandogli la manovra
  - Fa predisporre al secondo soccorritore la tavola spinale
  - Fa risalire il braccio sotto l’ascella distale del paziente ed afferra l’avambraccio opposto
  - Infila l’altra mano sotto l’ascella più vicina della vittima e blocca la testa a livello della mandibola facendola appoggiare sulla propria spalla
  - Tira la vittima verso di sé appoggiandola sul proprio torace e si allontana dall’auto
  - Il secondo soccorritore controlla l’estricazione degli arti inferiori e collabora all’effettuazione della manovra dopo
  - Insieme al secondo soccorritore esegue la manovra di posizionamento su tavola spinale e gli fa immobilizzare il rachide cervicale

