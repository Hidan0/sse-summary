# Scheda skill del corso SSE, riportata parola per parola (vedi CLAUDE.md, regola 2).
titolo: BLSD nell'adulto con CTE già in corso
intestazione: SKILL 02_BLSD ADULTO CON CTE IN CORSO (astanti)
gruppo: blsd
fonte: blsd-skill-cte
revisione: Rev.1 del 6/4/2017
riassunti: [blsd, defibrillatore-dae]

colonne: ["Linee guida per l'esecuzione", "Indicazioni per l'allievo"]
passi:
  - ["Valuta la scena", "Scena sicura"]
  - ["Il primo soccorritore si affianca all’astante che esegue le CTE e lo sostituisce, valuta rapidamente il respiro e continua le compressioni", "NON respira (o respiro anormale compatibile con ACC);\\\nIndividua il punto corretto di compressione e prosegue le CTE"]
  - ["Chiede DAE, fa allertare la SOREU", "Comunica ACC alla SOREU. Continua CTE fino a DAE pronto (conta ad alta voce)"]
  - ["Il 2° soccorritore prepara il DAE e il torace", "Accende il DAE, scopre il torace quanto basta, rade e asciuga se necessario"]
  - ["Applica gli elettrodi (non interrompendo CTE)", "Applica gli elettrodi e consente nella posizione corretta (valutare punti di applicazioni corretti)"]
  - ["Allontana i presenti, garantisce sicurezza per tutti durante l’analisi del DAE e l’erogazione dello shock", "Allontana i presenti e l’O₂, introduce il connettore e pronuncia la filastrocca durante l’analisi, pone una mano sul tasto di erogazione se scarica consigliata"]
  - ["Eroga shock se consigliato", "Eroga la scarica mantenendo il contatto visivo con la scena"]
  - ["Riprende (o fa riprendere) immediatamente le CTE", "Esegue CTE (valutare tecnica ed efficacia)"]
  - ["Il 1° soccorritore apre le vie aeree, ispeziona la cavità orale e posiziona la cannula orofaringea (*opzionale*)", "Estende il capo, solleva il mento, rimuove eventuali corpi estranei evidenti"]
  - ["Effettua 2 lente ventilazioni con pallone autoespansibile + reservoir collegati ad O₂ ad alti flussi", "Valutare correttezza della manovra (1 secondo per ognuna) ed efficacia (espansione del torace)"]
  - ["Prosegue con RCP 30:2 efficace con O₂, fino alla successiva analisi del DAE", "Ad ogni analisi interrompe RCP esegue il cambio per le CTE"]
  - ["Riconosce e risolve i messaggi di allarme/malfunzione del DAE", "Allerta la SOREU, continua con RCP e rimuove la causa se possibile"]

