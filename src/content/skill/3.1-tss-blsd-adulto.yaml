# Scheda skill del corso TSS, riportata parola per parola (vedi CLAUDE.md, regola 2).
titolo: BLSD nell'adulto (TSS)
intestazione: CAPITOLO G-SKILL BLSD
sottotitolo: BLSD Adulto
gruppo: tss
fonte: tss-skill-blsd
revisione: Rev.1 del 6/4/2017
riassunti: [blsd-trasporto-sanitario]

colonne: ["Linee guida per l'esecuzione", "Indicazioni per l'allievo"]
avvertenza: (in neretto le indicazioni per l’allievo)
passi:
  - ["Valuta la scena", "Scena sicura"]
  - ["Chiama il paziente, valuta presenza e qualità del respiro", "NON risponde, NON respira (o respiro ANORMALE COMPATIBILE con ACC)"]
  - ["Posiziona la persona supina, Inizia o fa iniziare le CTE", "Individua il punto corretto di compressione ed esegue CTE fino a DAE pronto (conta ad alta voce)"]
  - ["Chiede DAE, allerta o fa allertare il sistema d’emergenza 112/118", "Fa portare il DAE e chiama o fa chiamare il 112/118"]
  - ["Prepara il DAE e il torace", "Scopre il torace quanto basta, rade e asciuga se necessario"]
  - ["Accende il DAE e Applica gli elettrodi (non interrompendo CTE)", "Accende il DAE applica gli elettrodi e consente l’analisi"]
  - ["Allontana i presenti, **garantisce sicurezza** per tutti durante l’analisi e la carica del DAE", "Allontana i presenti e l’O₂, pronuncia la filastrocca durante l’analisi, posiziona la mano sul tasto di erogazione"]
  - ["Eroga shock se consigliato", "Eroga lo shock in sicurezza"]
  - ["Riprende (o fa riprendere) immediatamente CTE", "Esegue CTE (valutare tecnica ed efficacia)"]
  - ["Apre le vie aeree, ispeziona la cavità orale e posiziona la cannula orofaringea (*opzionale*)", "Estende il capo, solleva il mento, rimuove eventuali corpi estranei evidenti"]
  - ["Effettua 2 lente ventilazioni con pallone autoespandibile + reservoir collegati ad O₂ ad alti flussi", "Valutare correttezza della manovra (1 secondo per ognuna) ed efficacia (espansione del torace)"]
  - ["Prosegue con RCP 30:2 **efficace** con O₂, fino alla successiva analisi del DAE", "Ad ogni analisi interrompe RCP esegue il cambio per le CTE"]
  - ["Riconosce e risolve i messaggi di allarme/malfunzione del DAE", "Continua con RCP e rimuove la causa se possibile"]

commento: |
  La scheda usa il **pallone autoespandibile**, che nel materiale TSS si usa quando ci sono **2 soccorritori**, uno alla testa che ventila e uno al fianco che comprime. [@tss-g1:33] [@tss-manuale-blsd:19] Il ragionamento completo è nel [riassunto sul BLSD TSS](/riassunti/blsd-trasporto-sanitario).

  ### Differenze con la skill BLSD del corso SSE

  La [scheda SSE](/skill/blsd-adulto) ha gli stessi 13 passi, con queste differenze: [@blsd-skill:1]

  | Passo | Skill TSS | Skill SSE |
  |---|---|---|
  | 1. Scena | Scena sicura | Scena sicura **e ambiente adatto all'uso del DAE** |
  | 4. Allerta | **112/118**; fa **portare** il DAE | **[[SOREU]]**; fa **applicare** il DAE |
  | 5-6. DAE | Si **accende** il DAE al passo 6, insieme alle placche, e si consente l'analisi | Si **accende** il DAE già al passo 5, con la preparazione del torace; al passo 6 si valuta che le placche siano **nella posizione corretta** |
  | 7. Sicurezza | Allontana presenti e ossigeno, filastrocca, mano sul tasto | In più **inserisce il connettore** |
  | 8. Shock | Eroga in sicurezza | In più **mantiene il controllo visivo sulla scena** |

  [@tss-skill-blsd:1] [@blsd-skill:1]

  - Nel corso SSE c'è anche la [skill **con CTE già in corso**](/skill/blsd-adulto-cte-in-corso), quando gli astanti stanno già comprimendo: il primo soccorritore **sostituisce l'astante**, poi chiede il DAE, fa allertare la SOREU e le **comunica l'ACC**; in caso di allarmi del DAE **allerta la SOREU**. Vedi il [riassunto SSE sul BLSD](/riassunti/blsd#se-gli-astanti-stanno-gia-facendo-le-cte). [@blsd-skill-cte:1]
  - Nel corso SSE la sequenza parte dal **[[colpo d'occhio]]** sulla vittima, prima ancora di toccarla. [@blsd-manuale:10]

errori:
  - "Insufflazioni poco efficaci o non efficaci"
  - "Posizione delle piastre errata"
  - "Muove il DAE o il paziente durante l'analisi"
  - "Massaggio errato (profondità, posizione)"
  - "Più di 10 secondi senza CTE"
  - "Non mantiene la sicurezza"
