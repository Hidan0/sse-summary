# Algoritmo universale della valutazione primaria (TSS C.3 p. 6).
# Notazione sistemata: la divisione dei due rami diventa una domanda, inizio e fine espliciti.
# La slide parte da "No coscienza" e mette valutazione ABCDE e PLS nello stesso blocco
# ("No coscienza, respiro normale"): come nella tabella del riassunto, qui la vittima cosciente
# va alla valutazione ABCDE e quella incosciente con respiro normale in PLS (decisione dell'utente).
# "Applicazione DAE (appena possibile)" è raggiunta da una freccia tratteggiata dalle CTE e non prosegue.
titolo: Algoritmo universale
fonte: "tss-c3:6"

nodi:
  - { id: inizio, tipo: inizio, testo: Coscienza e respiro }
  - { id: coscienza, tipo: decisione, testo: "Cosciente?" }
  - { id: abcde, tipo: fine, testo: "Valutazione ABCDE" }
  - { id: respiro, tipo: decisione, testo: "Respiro assente\n(o non normale)?" }
  - { id: pls, tipo: fine, testo: "Posizione laterale\ndi sicurezza" }
  - { id: cte, testo: CTE }
  - { id: dae, testo: "Applicazione DAE\n(appena possibile)" }
  - { id: ventila, testo: "Apertura vie aeree\n2 ventilazioni" }
  - { id: rcp, tipo: fine, testo: "RCP (30:2)" }

archi:
  - [inizio, coscienza]
  - [coscienza, respiro, "No"]
  - [coscienza, abcde, "Sì"]
  - [respiro, cte, "Sì"]
  - [respiro, pls, "No"]
  - [cte, ventila]
  - [cte, dae]
  - [ventila, rcp]
