# Scenario d'esame del corso SSE (griglia rev. 2 del 27-11-2018), riscritto in forma strutturata.
# `azione` è ciò che la griglia si aspetta dal candidato (leader), `reperto` ciò che trova o gli viene detto.
# `punti`: colonna "%" della griglia; `penalita`: il (-n) di rivalutazione e consegna.
# `filtro` e `sintesi` sono nostri: il filtro vero non è nel materiale.
numero: 25
titolo: Uomo con fame d'aria di notte
tipo: medico
categoria: "Medico acuto: respiratoria 2"
fonte: "scenari:49-50"
revisione: Rev. 2 del 27-11-2018
msa: true
forze-ordine: false

filtro:
  fittizio: true
  voci:
    - ["Motivo della chiamata", "Difficoltà respiratoria"]
    - ["Paziente", "Uomo, 75 anni"]
    - ["Luogo", "Abitazione"]
    - ["Cosciente", "Sì"]
    - ["Respira", "Sì, con fatica"]

sintesi: |
  Uomo di 75 anni, cardiopatico, iperteso in terapia, con FA e un **recente ricovero per scompenso cardiaco**.
  Alle 5 del mattino è seduto a letto con due cuscini dietro la schiena, con **fame d'aria** iniziata la sera prima e peggiorata nella notte.
  È agitato, parla a frasi interrotte (**V**), ha secrezioni schiumose dalla bocca, rantoli e gorgoglii, **FR 36**, **SpO2 67%** in aria
  (**82%** con l'O2), FC **130** irregolare, cute fredda, sudata e pallida, **PA 220/110**, caviglie gonfie.

  Ci sono **segni che compromettono la sopravvivenza**: il candidato deve allertare la SOREU, che conferma l'arrivo dell'MSA.

fasi:
  - fase: prearrivo
    punti: 5
    righe:
      - azione: Assegna gli incarichi
  - fase: scena
    punti: 5
    righe:
      - azione: Chiede una descrizione della scena
        reperto: Uomo seduto a letto con due cuscini dietro la schiena, alle 5 del mattino
      - azione: Colpo d'occhio
        reperto: Difficoltà respiratoria con «fame d'aria», agitato
      - azione: Verifica se ci sono ostacoli al trasporto
        reperto: Nessun pericolo, scala interna stretta
  - fase: autoprotezione
    punti: 5
    righe:
      - azione: Indossa i dispositivi di protezione individuale
  - fase: a
    punti: 10
    righe:
      - azione: Chiama il paziente, si presenta, si qualifica e lo tranquillizza
        reperto: Agitato, apre gli occhi alla chiamata, parla ma non riesce a finire le frasi
      - azione: Verifica le vie aeree
        reperto: Vie aeree pervie, secrezioni schiumose dalla bocca
  - fase: b
    punti: 15
    righe:
      - azione: Osserva la meccanica respiratoria
        reperto: Bilaterale, usa la muscolatura accessoria
      - azione: Palpa delicatamente il torace
        reperto: Nessun dolore alla palpazione
      - azione: Ascolta i rumori respiratori
        reperto: Rantoli, gorgoglii
      - azione: Conta gli atti respiratori
        reperto: FR 36 atti/min
      - azione: Misura la saturazione senza O2
        reperto: SpO2 in lenta rilevazione (67%)
      - azione: Fa mettere la maschera con O2 ad alti flussi
        reperto: SpO2 in aumento (82%)
  - fase: c
    punti: 15
    righe:
      - azione: Rileva il polso radiale
        reperto: Presente, tachicardico, irregolare; FC 130 battiti/min
      - azione: Valuta la cute
        reperto: Fredda, sudata, pallida
      - azione: Misura la PA
        reperto: PA 220/110
  - fase: sopravvivenza
    righe:
      - azione: Allerta o fa allertare la SOREU (problema non risolvibile, rischio di vita)
        reperto: Se non la allerta, lo scenario è invalidato
  - fase: d
    punti: 10
    righe:
      - azione: Valuta secondo l'AVPU
        reperto: Paziente (V)
      - azione: Parla con il paziente
        reperto: Parla a frasi interrotte
      - azione: Valuta sensibilità e motilità
        reperto: Conservate ai 4 arti
  - fase: e
    punti: 10
    righe:
      - azione: Osserva l'aspetto generale
        reperto: Uomo di 75 anni, molto sofferente e affaticato, caviglie gonfie
      - azione: Chiede cos'è successo
        reperto: Affanno respiratorio da ieri sera, peggiorato durante la notte
      - azione: Valuta il dolore
        reperto: Nega dolore
      - azione: Storia clinica
        reperto: Difficoltà nella deambulazione; cardiopatico, iperteso in terapia, FA; la moglie riferisce un recente ricovero per scompenso cardiaco
      - azione: Protezione termica
  - fase: soreu
    punti: 5
    righe:
      - azione: Stato di coscienza
      - azione: Parametri rilevati
        reperto: Riferisce i parametri e l'AMPIA
      - azione: Problemi riscontrati
      - azione: Patologie pregresse
      - azione: Manovre eseguite
        reperto: La SOREU conferma l'arrivo dell'MSA
  - fase: rivalutazione
    penalita: 3
    righe:
      - azione: Rivaluta l'ABCDE e monitora i parametri vitali
      - azione: Relazione adeguata con il paziente
      - azione: Usa presidi adeguati per il trasporto
  - fase: consegna
    penalita: 2
    righe:
      - azione: Consegna il paziente (PS o MSA) trasmettendo le informazioni raccolte in modo completo e corretto
