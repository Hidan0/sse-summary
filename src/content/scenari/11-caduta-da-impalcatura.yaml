# Scenario d'esame del corso SSE (griglia rev. 2 del 27-11-2018), riscritto in forma strutturata.
# `azione` è ciò che la griglia si aspetta dal candidato (leader), `reperto` ciò che trova o gli viene detto.
# `punti`: colonna "%" della griglia; `penalita`: il (-n) di rivalutazione e consegna.
# `filtro` e `sintesi` sono nostri: il filtro vero non è nel materiale.
numero: 11
titolo: Caduta da un'impalcatura
tipo: trauma
categoria: "Infortunio: precipitato"
fonte: "scenari:21-22"
revisione: Rev. 2 del 27-11-2018
msa: true
forze-ordine: true

filtro:
  fittizio: true
  voci:
    - ["Motivo della chiamata", "Caduta da un'impalcatura"]
    - ["Paziente", "Uomo, circa 25 anni"]
    - ["Luogo", "Cantiere edile"]
    - ["Cosciente", "No"]
    - ["Respira", "Sì"]

sintesi: |
  Uomo straniero di 25 anni **precipitato dal 3° piano** di un'impalcatura in un cantiere edile; sulla scena ci sono travi sospese da mettere in sicurezza.
  È **incosciente (U)**, con sangue nel cavo orale che continua a uscire dopo l'aspirazione (cannula OF tollerata),
  **ferita soffiante all'emitorace destro**, FR 30 atti/min, **SpO2 non rilevabile**, polso radiale assente (carotideo presente, FC 130),
  cute pallida, sudata e umida, **PA 80/45**, deformità degli arti inferiori.

  Ci sono **segni che compromettono la sopravvivenza**: il candidato deve allertare la SOREU, che manda l'MSA.

fasi:
  - fase: prearrivo
    punti: 5
    righe:
      - azione: Assegna gli incarichi
  - fase: scena
    punti: 5
    righe:
      - azione: Chiede una descrizione della scena
        reperto: Cantiere edile, uomo a terra caduto da un'impalcatura
      - azione: Colpo d'occhio
        reperto: Supino, non si muove, respira, sangue sul volto
      - azione: Chiede la dinamica dell'evento
        reperto: Precipitato dal 3° piano
  - fase: autoprotezione
    punti: 5
    righe:
      - azione: Indossa i dispositivi di protezione individuale
      - azione: Controlla la presenza di pericoli
        reperto: Travi sospese ben visibili; fa mettere in sicurezza la zona dal personale del cantiere
  - fase: a
    punti: 15
    righe:
      - azione: Fa immobilizzare manualmente il rachide cervicale
        grave: true
      - azione: Chiama il paziente senza scuoterlo e osserva rapidamente il torace
        reperto: Paziente incosciente, respiro presente
      - azione: Verifica le vie aeree
        reperto: Sangue nel cavo orale
      - azione: Mantiene pervie le vie aeree
        reperto: Aspira per liberare le vie aeree, il sanguinamento persiste; posiziona la cannula orofaringea (tollerata)
      - azione: Fa posizionare il collare cervicale (opzionale)
  - fase: b
    punti: 15
    righe:
      - azione: Osserva la meccanica respiratoria
        reperto: Meccanica bilaterale
      - azione: Palpa delicatamente il torace
        reperto: Ferita soffiante all'emitorace destro
      - azione: Ascolta i rumori respiratori
        reperto: Rumori non valutabili, presenza di vomito ematico
      - azione: Conta gli atti respiratori
        reperto: FR 30 atti/min
      - azione: Misura la saturazione senza O2
        reperto: SpO2 non rilevabile
      - azione: Fa mettere la maschera con O2 ad alti flussi
  - fase: c
    punti: 15
    righe:
      - azione: Cerca emorragie esterne
        reperto: Ferite non sanguinanti
      - azione: Rileva il polso radiale e conta la FC
        reperto: Polso radiale non rilevabile, carotideo presente; FC 130 battiti/min
      - azione: Valuta la cute
        reperto: Pallida, sudata, umida
      - azione: Misura la PA
        reperto: PA 80/45 mmHg
  - fase: sopravvivenza
    righe:
      - azione: Allerta o fa allertare la SOREU (problema non risolvibile, rischio di vita)
        reperto: Se non la allerta, lo scenario è invalidato
  - fase: d
    punti: 5
    righe:
      - azione: Valuta secondo l'AVPU e pone domande adatte
        reperto: Non risponde e non si muove allo stimolo doloroso (U)
      - azione: Valuta sensibilità e motilità
        reperto: Non valutabili
  - fase: e
    punti: 10
    righe:
      - azione: Non spoglia completamente il paziente, ma espone gli arti con sospette fratture
        reperto: Deformità degli arti inferiori
      - azione: Cerca altri segni esterni
        reperto: Ferita soffiante al torace, non sanguinante
      - azione: Protezione termica
      - azione: Raccoglie altre notizie sul paziente
        reperto: Straniero, 25 anni, nessuna patologia nota
  - fase: soreu
    punti: 5
    righe:
      - azione: Conferma la dinamica
      - azione: Stato di coscienza
      - azione: Parametri rilevati
      - azione: Lesioni rilevate
        reperto: Deve comunicare il problema che compromette la sopravvivenza del paziente
      - azione: Patologie pregresse
      - azione: Manovre eseguite
        reperto: Medicazione su tre lati. La SOREU comunica che l'MSA è in arrivo
  - fase: rivalutazione
    penalita: 3
    righe:
      - azione: Rivaluta l'ABCDE e monitora i parametri vitali
      - azione: Relazione adeguata con il paziente
      - azione: Usa presidi adeguati per il trasporto
  - fase: consegna
    penalita: 2
    righe:
      - azione: Consegna il paziente (PS o MSA) trasmettendo le informazioni raccolte in modo completo e corretto
