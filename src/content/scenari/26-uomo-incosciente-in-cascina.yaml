# Scenario d'esame del corso SSE (griglia rev. 2 del 27-11-2018), riscritto in forma strutturata.
# `azione` è ciò che la griglia si aspetta dal candidato (leader), `reperto` ciò che trova o gli viene detto.
# `punti`: colonna "%" della griglia; `penalita`: il (-n) di rivalutazione e consegna.
# `filtro` e `sintesi` sono nostri: il filtro vero non è nel materiale.
# Nella griglia le caselle MSA e "FORZE dell'ORDINE in POSTO" sono tutte vuote (`null`): la SOREU invia
# VVF e MSA2 dopo la comunicazione.
numero: 26
titolo: Uomo incosciente in una cascina
tipo: medico
categoria: "Intossicazione: sostanze pericolose"
fonte: "scenari:51-52"
revisione: Rev. 2 del 27-11-2018
msa: null
forze-ordine: null

filtro:
  fittizio: true
  voci:
    - ["Motivo della chiamata", "Uomo trovato incosciente sul divano"]
    - ["Paziente", "Uomo, 45 anni"]
    - ["Luogo", "Abitazione (cascina)"]
    - ["Cosciente", "No"]
    - ["Respira", "Non riferito"]

sintesi: |
  Uomo di 45 anni, senza patologie né terapie, trovato **incosciente sul divano** dalla sorella; l'ultimo contatto è della sera prima e ha l'influenza da qualche giorno.
  È inverno, in una cascina con un **camino a braci accese** (se in dotazione, il **rilevatore di monossido** è in allarme): il candidato deve far aprire le finestre e far verificare se ci sono altre persone in casa.
  Risponde solo al dolore (**P**), non tollera la cannula, respiro lento con **FR 10**, **SpO2 97%** in aria (100% con l'O2), FC **110**, cute rosea e calda, PA 110/75.

  La griglia non ha la riga dei segni che compromettono la sopravvivenza; la SOREU invia i VVF e l'MSA2.

fasi:
  - fase: prearrivo
    punti: 5
    righe:
      - azione: Assegna gli incarichi
        reperto: Ogni componente controlla il materiale assegnato e lo porta sul luogo dell'intervento
  - fase: scena
    punti: 5
    righe:
      - azione: Chiede una descrizione della scena
        reperto: All'interno di una cascina, in inverno
      - azione: Colpo d'occhio
        reperto: Uomo sdraiato sul divano, incosciente, trovato dalla sorella al suo arrivo in casa; camino con braci accese
      - azione: Verifica se ci sono pericoli e ostacoli al trasporto
        reperto: Nessun ostacolo per il trasporto (se in dotazione, il rilevatore di monossido è in allarme)
  - fase: autoprotezione
    punti: 5
    righe:
      - azione: Indossa i dispositivi di protezione individuale
        reperto: Fa aprire le finestre e fa verificare se ci sono altre persone in casa
  - fase: a
    punti: 10
    righe:
      - azione: Chiama il paziente, si presenta e si qualifica
        reperto: Non risponde, si lamenta allo stimolo doloroso
      - azione: Verifica le vie aeree
        reperto: Vie aeree pervie (se mette la cannula, non la tollera)
  - fase: b
    punti: 15
    righe:
      - azione: Osserva la meccanica respiratoria
        reperto: Movimenti del torace normali, respiro lento
      - azione: Palpa delicatamente il torace
        reperto: Nessun dolore alla palpazione
      - azione: Ascolta i rumori respiratori
        reperto: Nessun rumore patologico
      - azione: Conta gli atti respiratori
        reperto: FR 10 atti/min
      - azione: Misura la saturazione senza O2
        reperto: SpO2 97%
      - azione: Fa mettere la maschera con O2 ad alti flussi
        reperto: Saturazione in aumento, 100%
  - fase: c
    punti: 15
    righe:
      - azione: Rileva il polso radiale
        reperto: Presente, pieno, ritmico; FC 110/min
      - azione: Valuta la cute
        reperto: Rosea, calda
      - azione: Misura la PA
        reperto: PA 110/75
  - fase: d
    punti: 10
    righe:
      - azione: Valuta secondo l'AVPU
        reperto: Paziente (P)
      - azione: Parla con il paziente
        reperto: Si lamenta allo stimolo doloroso
      - azione: Valuta sensibilità e motilità
        reperto: Conservate ai 4 arti
  - fase: e
    punti: 10
    righe:
      - azione: Osserva l'aspetto generale
        reperto: Uomo di aspetto normale
      - azione: Chiede cos'è successo
        reperto: Trovato sul divano dalla sorella; ultimo contatto la sera prima; influenza da qualche giorno
      - azione: Valuta il dolore
        reperto: Non valutabile
      - azione: Protezione termica
        reperto: Copre il paziente
      - azione: Storia clinica
        reperto: Uomo di 45 anni, nessuna patologia in anamnesi, non assume terapie
  - fase: soreu
    punti: 5
    righe:
      - azione: Stato di coscienza
      - azione: Parametri rilevati
        reperto: Riferisce i parametri e la sintomatologia
      - azione: Problemi riscontrati
        reperto: Nessun'altra persona presente in casa
      - azione: Patologie pregresse
      - azione: Manovre eseguite
        reperto: La SOREU invia VVF e MSA2
  - fase: rivalutazione
    penalita: 3
    righe:
      - azione: Rivaluta l'ABCDE e monitora i parametri vitali
      - azione: Relazione adeguata con il paziente
      - azione: Usa presidi adeguati per il trasporto
  - fase: consegna
    penalita: 2
    righe:
      - azione: Consegna il paziente (PS o MSA) trasmettendo le informazioni raccolte in modo completo e corretto
