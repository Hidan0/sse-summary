# Scenario d'esame del corso SSE (griglia rev. 2 del 27-11-2018), riscritto in forma strutturata.
# `azione` è ciò che la griglia si aspetta dal candidato (leader), `reperto` ciò che trova o gli viene detto.
# `punti`: colonna "%" della griglia; `penalita`: il (-n) di rivalutazione e consegna.
# `filtro` e `sintesi` sono nostri: il filtro vero non è nel materiale.
numero: 2
titolo: Bambino investito da un'auto
tipo: trauma
categoria: "Incidente stradale: investimento pedone"
fonte: "scenari:3-4"
revisione: Rev. 2 del 27-11-2018
msa: true
forze-ordine: true

filtro:
  fittizio: true
  voci:
    - ["Motivo della chiamata", "Investimento di pedone"]
    - ["Paziente", "Bambino, 9 anni"]
    - ["Luogo", "Strada"]
    - ["Cosciente", "Sì, piange"]
    - ["Respira", "Sì"]

sintesi: |
  Bambino di 9 anni investito da un'auto a bassa velocità, a terra supino a circa 1 m dall'auto; la madre è presente e nega malattie.
  È sveglio, piange, è orientato ma non ricorda l'accaduto; respiro nella norma, **FR 24**, **SpO2 98%** in aria.
  Polso flebile, **FC 120**, cute calda e sudata, **PA 105/50**. Ha un modesto sanguinamento e ferite lacero-contuse al labbro inferiore e in regione frontale,
  e una **tumefazione alla caviglia sinistra** con sospetta frattura.

  La griglia **non** segnala segni che compromettono la sopravvivenza; la SOREU comunica l'arrivo dell'MSA.

fasi:
  - fase: prearrivo
    punti: 5
    righe:
      - azione: Assegna gli incarichi
  - fase: scena
    punti: 5
    righe:
      - azione: Chiede una descrizione della scena
        reperto: Bambino a terra a circa 1 m dall'auto
      - azione: Colpo d'occhio
        reperto: Supino, piange
      - azione: Chiede la dinamica dell'evento
        reperto: Investito da un'auto a bassa velocità
      - azione: Verifica se ci sono altri feriti
        reperto: Nessun altro coinvolto
  - fase: autoprotezione
    punti: 5
    righe:
      - azione: Indossa i dispositivi di protezione individuale
      - azione: Controlla la presenza di pericoli
        reperto: Traffico fermo; fa posizionare l'MSB a protezione della scena
  - fase: a
    punti: 15
    righe:
      - azione: Fa immobilizzare manualmente il rachide cervicale
        grave: true
      - azione: Chiama il paziente senza scuoterlo, si presenta e si qualifica
        reperto: Sveglio, piange
      - azione: Verifica le vie aeree
        reperto: Vie aeree pervie
      - azione: Fa posizionare il collare cervicale
  - fase: b
    punti: 15
    righe:
      - azione: Osserva la meccanica respiratoria
        reperto: Nella norma
      - azione: Palpa delicatamente il torace
        reperto: Nessun dolore o segno di trauma
      - azione: Ascolta i rumori respiratori
        reperto: Assenti
      - azione: Conta gli atti respiratori
        reperto: FR 24 atti/min
      - azione: Misura la saturazione senza O2
        reperto: SpO2 98% in aria
      - azione: Fa mettere la maschera con O2 ad alti flussi
        reperto: SpO2 98%
  - fase: c
    punti: 15
    righe:
      - azione: Cerca emorragie esterne
        reperto: Modesto sanguinamento al labbro
      - azione: Rileva il polso radiale e conta la FC
        reperto: Flebile, FC 120 battiti/min
      - azione: Valuta la cute
        reperto: Calda, sudata
      - azione: Misura la PA
        reperto: PA 105/50 mmHg
  - fase: d
    punti: 5
    righe:
      - azione: Valuta secondo l'AVPU e pone domande adatte
        reperto: Sveglio (A); piange, orientato, non ricorda l'accaduto, spaventato
      - azione: Valuta sensibilità e motilità
        reperto: Motilità e sensibilità presenti
  - fase: e
    punti: 10
    righe:
      - azione: Non spoglia completamente il paziente, ma espone gli arti con sospette fratture
        reperto: Tumefazione alla caviglia sinistra, sospetta frattura
      - azione: Cerca altri segni esterni
        reperto: Ferite lacero-contuse al labbro inferiore e in regione frontale
      - azione: Raccoglie altre notizie sul paziente
        reperto: Bimbo di 9 anni; la madre, presente, nega malattie
      - azione: Protezione termica
  - fase: soreu
    punti: 5
    righe:
      - azione: Conferma la dinamica
      - azione: Stato di coscienza
      - azione: Parametri rilevati
      - azione: Lesioni rilevate
      - azione: Patologie pregresse
      - azione: Manovre eseguite
        reperto: La SOREU comunica l'arrivo dell'MSA
  - fase: rivalutazione
    penalita: 3
    righe:
      - azione: Rivaluta l'ABCDE e monitora i parametri vitali
      - azione: Relazione adeguata con il paziente
      - azione: Usa presidi adeguati per il trasporto
  - fase: consegna
    penalita: 2
    righe:
      - azione: Consegna il paziente (PS o MSA) trasmettendo le informazioni raccolte in modo completo e corretto
