# Scenario d'esame del corso SSE (griglia rev. 2 del 27-11-2018), riscritto in forma strutturata.
# `azione` è ciò che la griglia si aspetta dal candidato (leader), `reperto` ciò che trova o gli viene detto.
# `punti`: colonna "%" della griglia; `penalita`: il (-n) di rivalutazione e consegna.
# `filtro` e `sintesi` sono nostri: il filtro vero non è nel materiale.
numero: 22
titolo: Donna con formicolio al braccio
tipo: medico
categoria: "Medico acuto: neurologica 2"
fonte: "scenari:43-44"
revisione: Rev. 2 del 27-11-2018
msa: false
forze-ordine: false

filtro:
  fittizio: true
  voci:
    - ["Motivo della chiamata", "Formicolio e difficoltà a muovere un braccio"]
    - ["Paziente", "Donna, circa 55 anni"]
    - ["Luogo", "Abitazione"]
    - ["Cosciente", "Sì"]
    - ["Respira", "Sì"]

sintesi: |
  Donna di 55 anni, ansiosa, **ipertesa non in terapia**. Da **circa 45 minuti** prima della chiamata ha formicolio
  e difficoltà a muovere l'arto superiore sinistro.
  È vigile (A), agitata, parla in modo chiaro; sensibilità ridotta all'arto superiore sinistro; CPSS: linguaggio normale,
  **ipostenia del braccio sinistro**, rima labiale normale. PA **180/100**, FC 110, FR 22, SpO2 94% in aria, 99% con l'O2.

  La griglia **non** ha la riga dei segni che compromettono la sopravvivenza: alla SOREU si riferiscono parametri, età,
  tempo di insorgenza dei sintomi e CPSS positiva.

fasi:
  - fase: prearrivo
    punti: 5
    righe:
      - azione: Assegna gli incarichi
  - fase: scena
    punti: 5
    righe:
      - azione: Chiede una descrizione della scena
        reperto: Donna in casa, seduta su una sedia
      - azione: Colpo d'occhio
        reperto: Sveglia, si tocca ripetutamente la mano destra
      - azione: Verifica se ci sono ostacoli al trasporto
        reperto: Nessun ostacolo
  - fase: autoprotezione
    punti: 5
    righe:
      - azione: Indossa i dispositivi di protezione individuale
  - fase: a
    punti: 10
    righe:
      - azione: Chiama la paziente, si presenta, si qualifica e la tranquillizza
        reperto: Parla, agitata
      - azione: Verifica le vie aeree
        reperto: Vie aeree pervie
  - fase: b
    punti: 15
    righe:
      - azione: Osserva la meccanica respiratoria
        reperto: Movimenti del torace normali
      - azione: Palpa delicatamente il torace
        reperto: Nessun dolore alla palpazione
      - azione: Ascolta i rumori respiratori
        reperto: Nessun rumore patologico
      - azione: Conta gli atti respiratori
        reperto: FR 22 atti/min
      - azione: Misura la saturazione senza O2
        reperto: SpO2 94% in aria
      - azione: Fa mettere la maschera con O2 ad alti flussi
        reperto: SpO2 99%
  - fase: c
    punti: 10
    righe:
      - azione: Rileva il polso radiale
        reperto: Presente, regolare; FC 110 battiti/min
      - azione: Valuta la cute
        reperto: Calda, rosea
      - azione: Misura la PA
        reperto: PA 180/100
  - fase: d
    punti: 15
    righe:
      - azione: Valuta secondo l'AVPU
        reperto: Paziente (A); risponde con parole chiare e comprensibili
      - azione: Valuta sensibilità e motilità
        reperto: Motilità conservata, sensibilità ridotta all'arto superiore sinistro
      - azione: Valuta la scala CPSS (linguaggio, sollevamento degli arti superiori, mimica facciale)
        reperto: "Linguaggio normale; sollevamento degli arti superiori: ipostenia del braccio sinistro; mimica facciale: rima labiale normale"
  - fase: e
    punti: 10
    righe:
      - azione: Osserva l'aspetto generale
        reperto: Persona normopeso
      - azione: Chiede cos'è successo
        reperto: Riferisce formicolio e difficoltà di movimento all'arto superiore sinistro da circa 45 minuti prima della chiamata
      - azione: Protezione termica
      - azione: Storia clinica
        reperto: Paziente di 55 anni, ansiosa, ipertesa non in terapia
  - fase: soreu
    punti: 5
    righe:
      - azione: Stato di coscienza
      - azione: Parametri rilevati
      - azione: Problemi riscontrati
        reperto: Riferisce i parametri, l'età, il tempo di insorgenza dei sintomi e la scala CPSS positiva
      - azione: Patologie pregresse
      - azione: Manovre eseguite
  - fase: rivalutazione
    penalita: 3
    righe:
      - azione: Rivaluta l'ABCDE e monitora i parametri vitali
      - azione: Relazione adeguata con il paziente
      - azione: Usa presidi adeguati per il trasporto
  - fase: consegna
    penalita: 2
    righe:
      - azione: Consegna il paziente (PS o MSA) trasmettendo le informazioni raccolte in modo completo e corretto
