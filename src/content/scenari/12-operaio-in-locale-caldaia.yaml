# Scenario d'esame del corso SSE (griglia rev. 2 del 27-11-2018), riscritto in forma strutturata.
# `azione` è ciò che la griglia si aspetta dal candidato (leader), `reperto` ciò che trova o gli viene detto.
# `punti`: colonna "%" della griglia; `penalita`: il (-n) di rivalutazione e consegna.
# `filtro` e `sintesi` sono nostri: il filtro vero non è nel materiale.
numero: 12
titolo: Operaio nel locale caldaia
tipo: trauma
categoria: "Infortunio: ustione"
fonte: "scenari:23-24"
revisione: Rev. 2 del 27-11-2018
msa: false
forze-ordine: true

filtro:
  fittizio: true
  voci:
    - ["Motivo della chiamata", "Investito da un ritorno di fiamma della caldaia"]
    - ["Paziente", "Uomo, adulto"]
    - ["Luogo", "Locale caldaia"]
    - ["Cosciente", "Sì"]
    - ["Respira", "Sì"]

sintesi: |
  Operaio di 50 anni investito da un **ritorno di fiamma** della caldaia; nel locale c'è ancora fumo, le fiamme sono spente.
  È sveglio (A) e agitato, con **voce rauca** e volto annerito, sopracciglia bruciate; FR 25 atti/min, **SpO2 92%** in aria (95% con O2),
  FC 120, cute sudata, PA 140/80. Ha **rossore e flittene agli arti superiori** e flittene agli **arti inferiori fino alle ginocchia**:
  va rilevata l'estensione delle ustioni, che si raffreddano con fisiologica e si coprono con telini sterili. È allergico ad alcuni alimenti.

  La griglia **non** ha la riga dei segni che compromettono la sopravvivenza e non prevede l'MSA.

fasi:
  - fase: prearrivo
    punti: 5
    righe:
      - azione: Assegna gli incarichi
  - fase: scena
    punti: 5
    righe:
      - azione: Chiede una descrizione della scena
        reperto: Operaio all'interno di un locale caldaia
      - azione: Colpo d'occhio
        reperto: Seduto a terra, cosciente, agitato
      - azione: Chiede la dinamica dell'evento
        reperto: Investito dal ritorno di fiamma della caldaia
  - fase: autoprotezione
    punti: 5
    righe:
      - azione: Indossa i dispositivi di protezione individuale
      - azione: Controlla la presenza di pericoli
        reperto: Presenza di fumo, fiamme spente
  - fase: a
    punti: 15
    righe:
      - azione: Chiama il paziente senza scuoterlo, si presenta e si qualifica
        reperto: Cosciente, agitato, sofferente; racconta l'accaduto
      - azione: Verifica le vie aeree
        reperto: Vie aeree pervie, voce rauca, volto annerito
  - fase: b
    punti: 15
    righe:
      - azione: Osserva la meccanica respiratoria
        reperto: Meccanica bilaterale, superficiale, tachipnoico
      - azione: Palpa delicatamente il torace
        reperto: Nulla di particolare
      - azione: Ascolta i rumori respiratori
        reperto: Assenti
      - azione: Conta gli atti respiratori
        reperto: FR 25 atti/min
      - azione: Misura la saturazione senza O2
        reperto: SpO2 92% in aria
      - azione: Fa mettere la maschera con O2 ad alti flussi
        reperto: SpO2 95%
  - fase: c
    punti: 15
    righe:
      - azione: Cerca emorragie esterne
        reperto: Non ci sono emorragie
      - azione: Rileva il polso radiale e conta la FC
        reperto: Presente; FC 120 battiti/min
      - azione: Valuta la cute
        reperto: Sudata
      - azione: Misura la PA
        reperto: PA 140/80 mmHg
  - fase: d
    punti: 5
    righe:
      - azione: Valuta secondo l'AVPU e pone domande adatte
        reperto: Sveglio (A), ricorda l'accaduto
      - azione: Valuta sensibilità e motilità
        reperto: Motilità e sensibilità presenti
  - fase: e
    punti: 10
    righe:
      - azione: Non spoglia completamente il paziente, ma espone le zone ustionate
        reperto: Rossore e flittene agli arti superiori, flittene agli arti inferiori fino alle ginocchia; rileva l'estensione delle ustioni
      - azione: Cerca altri segni esterni
        reperto: Sopracciglia bruciate
      - azione: Protezione termica
      - azione: Raccoglie altre notizie sul paziente
        reperto: 50 anni, allergico ad alcuni alimenti
  - fase: soreu
    punti: 5
    righe:
      - azione: Conferma la dinamica
      - azione: Stato di coscienza
      - azione: Parametri rilevati
      - azione: Lesioni rilevate
      - azione: Patologie pregresse
      - azione: Manovre eseguite
        reperto: Raffredda le zone ustionate con soluzione fisiologica e copre le lesioni con telini sterili
  - fase: rivalutazione
    penalita: 3
    righe:
      - azione: Rivaluta l'ABCDE e monitora i parametri vitali
      - azione: Relazione adeguata con il paziente
      - azione: Usa presidi adeguati per il trasporto
  - fase: consegna
    penalita: 2
    righe:
      - azione: Consegna il paziente (PS o MSA) trasmettendo le informazioni raccolte in modo completo e corretto
