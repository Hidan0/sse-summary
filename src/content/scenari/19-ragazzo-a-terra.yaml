# Scenario d'esame del corso SSE (griglia rev. 2 del 27-11-2018), riscritto in forma strutturata.
# `azione` è ciò che la griglia si aspetta dal candidato (leader), `reperto` ciò che trova o gli viene detto.
# `punti`: colonna "%" della griglia; `penalita`: il (-n) di rivalutazione e consegna.
# `filtro` e `sintesi` sono nostri: il filtro vero non è nel materiale.
numero: 19
titolo: Ragazzo a terra dopo un malore
tipo: medico
categoria: "Medico acuto: neurologica"
fonte: "scenari:37-38"
revisione: Rev. 2 del 27-11-2018
msa: true
forze-ordine: true

filtro:
  fittizio: true
  voci:
    - ["Motivo della chiamata", "Malore improvviso"]
    - ["Paziente", "Ragazzo"]
    - ["Luogo", "Non riferito"]
    - ["Cosciente", "Non parla, occhi chiusi"]
    - ["Respira", "Sì"]

sintesi: |
  Ragazzo di 19 anni, **epilettico noto** in terapia, supino sul pavimento dopo un malore improvviso: gli astanti descrivono una **caduta a terra con convulsioni**
  e ha un evidente **morso sulla lingua**. Apre gli occhi alla chiamata (**V**), risponde e si lamenta; vie aeree pervie, FR 18, SpO2 93% in aria (100% con l'O2),
  FC 100, PA 140/80, sensibilità e motilità conservate. Durante il trasporto è **vigile e orientato**.

  La griglia **non** ha la riga dei segni che compromettono la sopravvivenza. Prevede l'immobilizzazione manuale del rachide cervicale.

fasi:
  - fase: prearrivo
    punti: 5
    righe:
      - azione: Assegna gli incarichi
  - fase: scena
    punti: 5
    righe:
      - azione: Chiede una descrizione della scena
        reperto: L'addetto alla sicurezza riferisce che il ragazzo ha avuto un malore improvviso
      - azione: Colpo d'occhio
        reperto: Paziente supino sul pavimento, non parla, occhi chiusi
      - azione: Verifica se ci sono ostacoli al trasporto
        reperto: Nessun ostacolo
  - fase: autoprotezione
    punti: 5
    righe:
      - azione: Indossa i dispositivi di protezione individuale
  - fase: a
    punti: 10
    righe:
      - azione: Fa immobilizzare manualmente il rachide cervicale
        grave: true
      - azione: Chiama il paziente, si presenta, si qualifica e lo tranquillizza
        reperto: Apre gli occhi alla chiamata
      - azione: Verifica le vie aeree
        reperto: Vie aeree pervie
  - fase: b
    punti: 15
    righe:
      - azione: Osserva la meccanica respiratoria
        reperto: Il torace si espande bilateralmente
      - azione: Palpa delicatamente il torace
        reperto: Non lamenta dolore
      - azione: Ascolta i rumori respiratori
        reperto: Nessun rumore
      - azione: Conta gli atti respiratori
        reperto: FR 18 atti/min
      - azione: Misura la saturazione senza O2
        reperto: SpO2 93% in aria
      - azione: Fa mettere la maschera con O2 ad alti flussi
        reperto: SpO2 100% in ossigeno
  - fase: c
    punti: 15
    righe:
      - azione: Rileva il polso radiale
        reperto: Presente, regolare; FC 100 battiti/min
      - azione: Valuta la cute
        reperto: Calda
      - azione: Misura la PA
        reperto: PA 140/80
  - fase: d
    punti: 10
    righe:
      - azione: Valuta secondo l'AVPU
        reperto: V
      - azione: Parla con il paziente
        reperto: Risponde, si lamenta alla chiamata
      - azione: Valuta sensibilità e motilità
        reperto: Sensibilità e motilità conservate ai 4 arti
  - fase: e
    punti: 10
    righe:
      - azione: Osserva l'aspetto generale
        reperto: Evidente morso sulla lingua (morsus)
      - azione: Chiede cos'è successo
        reperto: Gli astanti descrivono una caduta a terra con convulsioni
      - azione: Valuta il dolore
        reperto: Non valutabile
      - azione: Protezione termica
      - azione: Storia clinica
        reperto: Ragazzo di 19 anni, epilettico noto, in terapia
  - fase: soreu
    punti: 5
    righe:
      - azione: Stato di coscienza
      - azione: Parametri rilevati
        reperto: Riferisce i parametri e la terapia in atto
      - azione: Problemi riscontrati
      - azione: Patologie pregresse
      - azione: Manovre eseguite
  - fase: rivalutazione
    penalita: 3
    righe:
      - azione: Rivaluta l'ABCDE e monitora i parametri vitali
        reperto: Durante il trasporto il paziente è vigile e orientato
      - azione: Relazione adeguata con il paziente
      - azione: Usa presidi adeguati per il trasporto
  - fase: consegna
    penalita: 2
    righe:
      - azione: Consegna il paziente (PS o MSA) trasmettendo le informazioni raccolte in modo completo e corretto
