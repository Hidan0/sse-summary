# Scenario d'esame del corso SSE (griglia rev. 2 del 27-11-2018), riscritto in forma strutturata.
# `azione` è ciò che la griglia si aspetta dal candidato (leader), `reperto` ciò che trova o gli viene detto.
# `punti`: colonna "%" della griglia; `penalita`: il (-n) di rivalutazione e consegna.
# `filtro` e `sintesi` sono nostri: il filtro vero non è nel materiale.
numero: 16
titolo: Uomo sofferente in palestra
tipo: medico
categoria: "Medico acuto: cardiocircolatoria"
fonte: "scenari:31-32"
revisione: Rev. 2 del 27-11-2018
msa: true
forze-ordine: false

filtro:
  fittizio: true
  voci:
    - ["Motivo della chiamata", "Malore, si tiene la mano al petto"]
    - ["Paziente", "Uomo, circa 50 anni"]
    - ["Luogo", "Palestra, negli spogliatoi"]
    - ["Cosciente", "Sì"]
    - ["Respira", "Sì"]

sintesi: |
  Uomo di circa 50 anni negli spogliatoi di una palestra: dopo l'esercizio fisico ha un **dolore toracico costrittivo** irradiato al braccio sinistro e alla mandibola,
  di intensità **9**, iniziato da circa 20 minuti (primo episodio). È molto agitato, respira con difficoltà a **28 atti/min**, saturazione **non rilevabile**,
  polso radiale **molto flebile e aritmico** (FC 65), **PAS 70**, cute pallida, fredda e sudata. Non tollera la maschera e si accascia sulla panca.
  Fumatore, ipercolesterolemia, nessuna terapia.

  Ci sono **segni che compromettono la sopravvivenza**: il candidato deve allertare la SOREU, che conferma l'arrivo dell'MSA.

fasi:
  - fase: prearrivo
    punti: 5
    righe:
      - azione: Assegna gli incarichi
  - fase: scena
    punti: 5
    righe:
      - azione: Chiede una descrizione della scena
        reperto: In palestra, uomo di circa 50 anni seduto negli spogliatoi, occhi aperti, mano al petto, sofferente
      - azione: Colpo d'occhio
      - azione: Verifica se ci sono ostacoli al trasporto
        reperto: Nessun impedimento
  - fase: autoprotezione
    punti: 5
    righe:
      - azione: Indossa i dispositivi di protezione individuale
  - fase: a
    punti: 10
    righe:
      - azione: Chiama il paziente, si presenta, si qualifica e lo tranquillizza
        reperto: Cosciente, molto agitato
      - azione: Verifica le vie aeree
        reperto: Vie aeree pervie
  - fase: b
    punti: 15
    righe:
      - azione: Osserva la meccanica respiratoria
        reperto: Respiro difficoltoso
      - azione: Palpa delicatamente il torace
        reperto: Nessun dolore alla digitopressione
      - azione: Ascolta i rumori respiratori
        reperto: Nessun rumore patologico
      - azione: Conta gli atti respiratori
        reperto: FR 28 atti/min
      - azione: Misura la saturazione senza O2
        reperto: Saturazione non rilevabile
      - azione: Fa mettere la maschera con O2 ad alti flussi
        reperto: Non tollera la maschera, si accascia sulla panca dello spogliatoio
  - fase: c
    punti: 15
    righe:
      - azione: Rileva il polso radiale
        reperto: Molto flebile, aritmico; FC 65 battiti/min
      - azione: Valuta la cute
        reperto: Pallida, fredda, sudata
      - azione: Misura la PA
        reperto: PAS 70; indaga il dolore toracico
  - fase: sopravvivenza
    righe:
      - azione: Allerta o fa allertare la SOREU (problema non risolvibile, rischio di vita)
        reperto: Se non la allerta, lo scenario è invalidato
  - fase: d
    punti: 10
    righe:
      - azione: Valuta secondo l'AVPU
        reperto: Cosciente (A)
      - azione: Parla con il paziente
        reperto: Si lamenta del dolore
      - azione: Valuta sensibilità e motilità
        reperto: Motilità e sensibilità conservate
  - fase: e
    punti: 10
    righe:
      - azione: Osserva l'aspetto generale
        reperto: Sofferente, pallore diffuso
      - azione: Chiede cos'è successo
        reperto: Dopo l'esercizio fisico è comparso un dolore toracico costrittivo irradiato al braccio sinistro e alla mandibola; è il primo episodio
      - azione: Valuta il dolore
        reperto: Intensità del dolore 9; sintomi iniziati da circa 20 minuti
      - azione: Protezione termica
      - azione: Storia clinica
        reperto: Nessuna patologia, nessuna terapia; fumatore, ipercolesterolemia
  - fase: soreu
    punti: 5
    righe:
      - azione: Stato di coscienza
      - azione: Parametri rilevati
      - azione: Problemi riscontrati
        reperto: Deve comunicare i segni e i sintomi che compromettono la sopravvivenza
      - azione: Patologie pregresse
      - azione: Manovre eseguite
        reperto: La SOREU conferma l'arrivo dell'MSA
  - fase: rivalutazione
    penalita: 3
    righe:
      - azione: Rivaluta l'ABCDE e monitora i parametri vitali
      - azione: Relazione adeguata con il paziente
      - azione: Usa presidi adeguati per il trasporto
  - fase: consegna
    penalita: 2
    righe:
      - azione: Consegna il paziente (PS o MSA) trasmettendo le informazioni raccolte in modo completo e corretto
