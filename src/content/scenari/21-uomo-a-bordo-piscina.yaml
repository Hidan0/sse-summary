# Scenario d'esame del corso SSE (griglia rev. 2 del 27-11-2018), riscritto in forma strutturata.
# `azione` è ciò che la griglia si aspetta dal candidato (leader), `reperto` ciò che trova o gli viene detto.
# `punti`: colonna "%" della griglia; `penalita`: il (-n) di rivalutazione e consegna.
# `filtro` e `sintesi` sono nostri: il filtro vero non è nel materiale.
numero: 21
titolo: Uomo a bordo piscina che non parla
tipo: medico
categoria: "Medico acuto: neurologica"
fonte: "scenari:41-42"
revisione: Rev. 2 del 27-11-2018
msa: false
forze-ordine: false

filtro:
  fittizio: true
  voci:
    - ["Motivo della chiamata", "Malore durante la ginnastica in acqua"]
    - ["Paziente", "Uomo, circa 70 anni"]
    - ["Luogo", "Piscina coperta"]
    - ["Cosciente", "Sì, ma non parla"]
    - ["Respira", "Sì"]

sintesi: |
  Uomo di 70 anni, molto robusto, iperteso in terapia, fumatore, in sovrappeso, con placche carotidee.
  Durante la ginnastica in acqua all'improvviso non è più riuscito a sorreggersi; i sintomi sono comparsi **da circa 30 minuti**.
  È vigile (A), segue con lo sguardo ma **non parla**; CPSS: linguaggio assente, **nessuna motilità dell'arto superiore destro**,
  **deviazione della rima labiale a destra**. PA **220/110**, FC 105, FR 18, SpO2 94% in aria, in aumento con l'O2.

  La griglia **non** ha la riga dei segni che compromettono la sopravvivenza: alla SOREU si riferiscono parametri, età,
  tempo di insorgenza dei sintomi, CPSS positiva e terapia.

fasi:
  - fase: prearrivo
    punti: 5
    righe:
      - azione: Assegna gli incarichi
  - fase: scena
    punti: 5
    righe:
      - azione: Chiede una descrizione della scena
        reperto: Uomo sdraiato a bordo vasca in una piscina coperta
      - azione: Colpo d'occhio
        reperto: Si muove, non parla
      - azione: Verifica se ci sono ostacoli al trasporto
        reperto: Nessun ostacolo
  - fase: autoprotezione
    punti: 5
    righe:
      - azione: Indossa i dispositivi di protezione individuale
  - fase: a
    punti: 10
    righe:
      - azione: Chiama il paziente, si presenta, si qualifica e lo tranquillizza
        reperto: Guarda il soccorritore e lo segue con lo sguardo, ma NON parla
      - azione: Verifica le vie aeree
        reperto: Vie aeree pervie
  - fase: b
    punti: 15
    righe:
      - azione: Osserva la meccanica respiratoria
        reperto: Normale espansione del torace
      - azione: Palpa delicatamente il torace
        reperto: Nessun segno
      - azione: Ascolta i rumori respiratori
        reperto: Nessun rumore patologico
      - azione: Conta gli atti respiratori
        reperto: FR 18 atti/min
      - azione: Misura la saturazione senza O2
        reperto: SpO2 94% in aria
      - azione: Fa mettere la maschera con O2 ad alti flussi
        reperto: Saturazione in aumento
  - fase: c
    punti: 10
    righe:
      - azione: Rileva il polso radiale
        reperto: Presente, regolare; FC 105 battiti/min
      - azione: Valuta la cute
        reperto: Calda, rosea
      - azione: Misura la PA
        reperto: PA 220/110
  - fase: d
    punti: 15
    righe:
      - azione: Valuta secondo l'AVPU
        reperto: Paziente (A)
      - azione: Parla con il paziente
        reperto: Cosciente, segue con lo sguardo, non parla
      - azione: Valuta la scala CPSS (linguaggio, movimento degli arti superiori, mimica facciale)
        reperto: "Linguaggio assente; nessuna motilità dell'arto superiore destro; deviazione della rima labiale a destra"
  - fase: e
    punti: 10
    righe:
      - azione: Osserva l'aspetto generale
        reperto: Persona molto robusta
      - azione: Chiede cos'è successo
        reperto: Durante la ginnastica in acqua all'improvviso non è più riuscito a sorreggersi; sintomi comparsi da circa 30 minuti
      - azione: Valuta il dolore
      - azione: Protezione termica
      - azione: Storia clinica
        reperto: Uomo di 70 anni, iperteso in terapia; fumatore, in sovrappeso, placche carotidee
  - fase: soreu
    punti: 5
    righe:
      - azione: Stato di coscienza
      - azione: Parametri rilevati
      - azione: Problemi riscontrati
        reperto: Riferisce i parametri, l'età, il tempo di insorgenza dei sintomi, la scala CPSS positiva e la terapia che assume
      - azione: Patologie pregresse
      - azione: Manovre eseguite
  - fase: rivalutazione
    penalita: 3
    righe:
      - azione: Rivaluta l'ABCDE e monitora i parametri vitali
      - azione: Relazione adeguata con il paziente
      - azione: Usa presidi adeguati per il trasporto
  - fase: consegna
    penalita: 2
    righe:
      - azione: Consegna il paziente (PS o MSA) trasmettendo le informazioni raccolte in modo completo e corretto
