# Scenario d'esame del corso SSE (griglia rev. 2 del 27-11-2018), riscritto in forma strutturata.
# `azione` è ciò che la griglia si aspetta dal candidato (leader), `reperto` ciò che trova o gli viene detto.
# `punti`: colonna "%" della griglia; `penalita`: il (-n) di rivalutazione e consegna.
# `filtro` e `sintesi` sono nostri: il filtro vero non è nel materiale.
numero: 1
titolo: Auto contro un ostacolo con un bambino a bordo
tipo: trauma
categoria: "Incidente stradale: contro ostacolo"
fonte: "scenari:1-2"
revisione: Rev. 2 del 27-11-2018
msa: false
forze-ordine: true

filtro:
  fittizio: true
  voci:
    - ["Motivo della chiamata", "Auto contro un ostacolo, bambino a bordo"]
    - ["Paziente", "Bambino, 4 anni"]
    - ["Luogo", "Strada, auto fuori dalla carreggiata"]
    - ["Cosciente", "Sì, piange"]
    - ["Respira", "Sì"]

sintesi: |
  Bambino di 4 anni seduto nel seggiolino di un'auto finita contro un ostacolo con un urto laterale (finestrino rotto); il conducente è fuori dal veicolo.
  È sveglio, piange ed è agitato; tachipnoico con **FR 25** e **SpO2 98%** in aria, FC 125, cute rosea; la PA non si misura perché non si lascia mettere il bracciale.
  Ha escoriazioni al volto dovute ai vetri, nessuna frattura evidente, anamnesi muta. Viene estratto dall'auto con il seggiolino.

  La griglia **non** segnala segni che compromettono la sopravvivenza e non prevede l'MSA.

fasi:
  - fase: prearrivo
    punti: 5
    righe:
      - azione: Assegna gli incarichi
  - fase: scena
    punti: 5
    righe:
      - azione: Chiede una descrizione della scena
        reperto: Auto contro un ostacolo, urto laterale; una portiera posteriore bloccata con il finestrino rotto, l'altra portiera aperta
      - azione: Colpo d'occhio
        reperto: Conducente in piedi fuori dal veicolo; bimbo di 4 anni in auto nel seggiolino, si muove e piange
      - azione: Chiede la dinamica dell'evento
        reperto: Perdita di controllo del veicolo in curva; non ci sono altri mezzi coinvolti
  - fase: autoprotezione
    punti: 5
    righe:
      - azione: Indossa i dispositivi di protezione individuale
        reperto: Caschetto, guanti, occhiali
      - azione: Controlla la presenza di pericoli
        reperto: Nessun pericolo, auto fuori dalla carreggiata
  - fase: a
    punti: 15
    righe:
      - azione: Parla con il paziente, si presenta e si qualifica
        reperto: Cosciente, piange, agitato
      - azione: Verifica le vie aeree
        reperto: Vie aeree pervie
  - fase: b
    punti: 15
    righe:
      - azione: Osserva la meccanica respiratoria
        reperto: Tachipnoico
      - azione: Palpa delicatamente il torace
        reperto: Nulla di evidente
      - azione: Ascolta i rumori respiratori
        reperto: Pianto valido
      - azione: Conta gli atti respiratori
        reperto: FR 25 atti/min
      - azione: Misura la saturazione senza O2
        reperto: SpO2 98% in aria
      - azione: Fa mettere la maschera con O2 ad alti flussi
        reperto: SpO2 98%
  - fase: c
    punti: 15
    righe:
      - azione: Cerca emorragie esterne
        reperto: Nessuna emorragia esterna
      - azione: Rileva il polso radiale e conta la FC
        reperto: Presente, FC 125 battiti/min
      - azione: Valuta la cute
        reperto: Rosea
      - azione: Misura la PA
        reperto: Non si lascia mettere il bracciale
  - fase: d
    punti: 5
    righe:
      - azione: Valuta secondo l'AVPU e pone domande adatte
        reperto: Sveglio (A), agitato
      - azione: Valuta sensibilità e motilità
        reperto: Motilità e sensibilità presenti
  - fase: e
    punti: 10
    righe:
      - azione: Non spoglia completamente il paziente, ma espone gli arti con sospette fratture
        reperto: Nessuna frattura evidente
      - azione: Cerca altri segni esterni
        reperto: Escoriazioni al volto provocate dalla rottura del finestrino
      - azione: Protezione termica
      - azione: Raccoglie altre notizie sul paziente
        reperto: Bimbo di 4 anni, anamnesi muta
  - fase: soreu
    punti: 5
    righe:
      - azione: Conferma la dinamica
      - azione: Stato di coscienza
      - azione: Parametri rilevati
      - azione: Lesioni rilevate
      - azione: Patologie pregresse
      - azione: Manovre eseguite
        reperto: Estrae il bambino dall'auto con il seggiolino
  - fase: rivalutazione
    penalita: 3
    righe:
      - azione: Rivaluta l'ABCDE e monitora i parametri vitali
      - azione: Relazione adeguata con il paziente
      - azione: Usa presidi adeguati per il trasporto
  - fase: consegna
    penalita: 2
    righe:
      - azione: Consegna il paziente (PS o MSA) trasmettendo le informazioni raccolte in modo completo e corretto
