# Scenario d'esame del corso SSE (griglia rev. 2 del 27-11-2018), riscritto in forma strutturata.
# `azione` è ciò che la griglia si aspetta dal candidato (leader), `reperto` ciò che trova o gli viene detto.
# `punti`: colonna "%" della griglia; `penalita`: il (-n) di rivalutazione e consegna.
# `filtro` e `sintesi` sono nostri: il filtro vero non è nel materiale.
numero: 23
titolo: Uomo a letto con febbre
tipo: medico
categoria: "Medico acuto: infettiva"
fonte: "scenari:45-46"
revisione: Rev. 2 del 27-11-2018
msa: false
forze-ordine: false

filtro:
  fittizio: true
  voci:
    - ["Motivo della chiamata", "Febbre alta da 3 giorni, confuso"]
    - ["Paziente", "Uomo giovane"]
    - ["Luogo", "Abitazione"]
    - ["Cosciente", "Sì, confuso"]
    - ["Respira", "Sì"]

sintesi: |
  Uomo di 43 anni proveniente dal Ghana, arrivato dall'estero da una settimana; storia clinica non nota.
  Da 3 giorni ha **febbre elevata** e **cefalea intensa**, ha difficoltà a muovere il collo; la Tachipirina presa 2 ore prima non ha fatto effetto.
  **TC 40,0 °C**, labbra asciutte, cute molto calda. Risponde alla voce (**V**), confuso e poco comprensibile, senza deficit.
  Respiro superficiale, **FR 32**, **SpO2 91%** in aria, 100% con l'O2; polso flebile, **FC 130**, PA 100/80.

  Se è segnalata una sospetta malattia infettiva servono guanti e mascherina. La griglia **non** ha la riga dei segni
  che compromettono la sopravvivenza: alla SOREU si riferiscono parametri e sintomi.

fasi:
  - fase: prearrivo
    punti: 5
    righe:
      - azione: Assegna gli incarichi
  - fase: scena
    punti: 5
    righe:
      - azione: Chiede una descrizione della scena
        reperto: Uomo giovane di colore sdraiato a letto, occhi chiusi
      - azione: Colpo d'occhio
      - azione: Verifica se ci sono ostacoli al trasporto
        reperto: Difficoltà per il trasporto, oggetti sparsi per il corridoio
  - fase: autoprotezione
    punti: 5
    righe:
      - azione: Indossa i dispositivi di protezione individuale
        reperto: Guanti e mascherina (se è segnalata una sospetta malattia infettiva)
  - fase: a
    punti: 10
    righe:
      - azione: Chiama il paziente, si presenta, si qualifica e lo tranquillizza
        reperto: Apre gli occhi alla chiamata, confuso
      - azione: Verifica le vie aeree
        reperto: Vie aeree pervie
  - fase: b
    punti: 15
    righe:
      - azione: Osserva la meccanica respiratoria
        reperto: Respiro superficiale, meccanica bilaterale
      - azione: Palpa delicatamente il torace
        reperto: Nessun dolore alla palpazione
      - azione: Ascolta i rumori respiratori
        reperto: Nessun rumore patologico
      - azione: Conta gli atti respiratori
        reperto: FR 32 atti/min
      - azione: Misura la saturazione senza O2
        reperto: SpO2 91%
      - azione: Fa mettere la maschera con O2 ad alti flussi
        reperto: SpO2 100%
  - fase: c
    punti: 15
    righe:
      - azione: Rileva il polso radiale
        reperto: Presente, flebile, ritmico; FC 130 battiti/min
      - azione: Valuta la cute
        reperto: Molto calda (persona di colore)
      - azione: Misura la PA
        reperto: PA 100/80
  - fase: d
    punti: 10
    righe:
      - azione: Valuta secondo l'AVPU
        reperto: Paziente (V)
      - azione: Parla con il paziente
        reperto: Apre gli occhi alla chiamata, risponde in modo confuso e poco comprensibile
      - azione: Valuta sensibilità e motilità
        reperto: Nessun deficit
  - fase: e
    punti: 10
    righe:
      - azione: Osserva l'aspetto generale
        reperto: Labbra asciutte, TC elevata (40,0 °C)
      - azione: Chiede cos'è successo
        reperto: Difficoltà a muovere il collo; i parenti riferiscono febbre elevata e cefalea intensa da 3 giorni, è arrivato dall'estero da una settimana; ha preso Tachipirina 2 ore prima, senza beneficio
      - azione: Valuta il dolore
        reperto: Cefalea non valutabile
      - azione: Storia clinica
        reperto: Uomo di 43 anni proveniente dal Ghana; storia clinica non nota
      - azione: Protezione termica
  - fase: soreu
    punti: 5
    righe:
      - azione: Stato di coscienza
      - azione: Parametri rilevati
      - azione: Problemi riscontrati
        reperto: Riferisce i parametri e i sintomi
      - azione: Patologie pregresse
      - azione: Manovre eseguite
  - fase: rivalutazione
    penalita: 3
    righe:
      - azione: Rivaluta l'ABCDE e monitora i parametri vitali
      - azione: Relazione adeguata con il paziente
      - azione: Usa presidi adeguati per il trasporto
  - fase: consegna
    penalita: 2
    righe:
      - azione: Consegna il paziente (PS o MSA) trasmettendo le informazioni raccolte in modo completo e corretto
