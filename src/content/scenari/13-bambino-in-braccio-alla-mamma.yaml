# Scenario d'esame del corso SSE (griglia rev. 2 del 27-11-2018), riscritto in forma strutturata.
# `azione` è ciò che la griglia si aspetta dal candidato (leader), `reperto` ciò che trova o gli viene detto.
# `punti`: colonna "%" della griglia; `penalita`: il (-n) di rivalutazione e consegna.
# `filtro` e `sintesi` sono nostri: il filtro vero non è nel materiale.
numero: 13
titolo: Bambino che non si muove
tipo: medico
categoria: "Medico acuto: neurologica"
fonte: "scenari:25-26"
revisione: Rev. 2 del 27-11-2018
msa: false
forze-ordine: false

filtro:
  fittizio: true
  voci:
    - ["Motivo della chiamata", "Bambino che non si muove"]
    - ["Paziente", "Bambino piccolo (in braccio alla mamma)"]
    - ["Luogo", "Non riferito"]
    - ["Cosciente", "Non apre gli occhi"]
    - ["Respira", "Sì"]

sintesi: |
  Bambino in braccio alla mamma, **soporoso**, non apre gli occhi e risponde solo allo **stimolo doloroso (P)**, ma si lamenta.
  Respiro regolare, FR 25 atti/min, SpO2 98%; FC 150, cute molto calda e arrossata, PA 100/50; **febbre a 39,5 °C**.
  I genitori riferiscono **convulsioni febbrili**, per cui hanno già somministrato il Micronoan per via rettale come indicato dal pediatra;
  ha avuto altri 2 episodi convulsivi con la febbre alta. Non va coperto. Durante il trasporto diventa più contattabile (**AVPU → V**).

  La griglia **non** ha la riga dei segni che compromettono la sopravvivenza e non prevede l'MSA.

fasi:
  - fase: prearrivo
    punti: 5
    righe:
      - azione: Assegna gli incarichi
  - fase: scena
    punti: 5
    righe:
      - azione: Chiede una descrizione della scena
        reperto: La mamma tiene in braccio il bimbo, che non si muove
      - azione: Colpo d'occhio
      - azione: Verifica se ci sono ostacoli al trasporto
        reperto: Nessun pericolo né ostacolo
  - fase: autoprotezione
    punti: 5
    righe:
      - azione: Indossa i dispositivi di protezione individuale
  - fase: a
    punti: 10
    righe:
      - azione: Chiama il bambino, si presenta e si qualifica
        reperto: Soporoso, non apre gli occhi
      - azione: Verifica le vie aeree
        reperto: Vie aeree pervie
  - fase: b
    punti: 15
    righe:
      - azione: Osserva la meccanica respiratoria
        reperto: Respiro regolare
      - azione: Palpa delicatamente il torace
        reperto: Non si lamenta
      - azione: Ascolta i rumori respiratori
        reperto: Nessun rumore patologico
      - azione: Conta gli atti respiratori
        reperto: FR 25 atti/min
      - azione: Misura la saturazione senza O2
        reperto: SpO2 98%
      - azione: Fa mettere la maschera con O2 ad alti flussi
        reperto: SpO2 98% con O2
  - fase: c
    punti: 15
    righe:
      - azione: Rileva il polso periferico
        reperto: Presente, regolare; FC 150 battiti/min
      - azione: Valuta la cute
        reperto: Molto calda, arrossata
      - azione: Misura la PA (opzionale)
        reperto: PA 100/50
  - fase: d
    punti: 10
    righe:
      - azione: Valuta secondo l'AVPU
        reperto: Risponde allo stimolo doloroso (P)
      - azione: Chiama e stimola il bambino
        reperto: Si lamenta
      - azione: Valuta sensibilità e motilità
        reperto: Presenti ai 4 arti
  - fase: e
    punti: 10
    righe:
      - azione: Osserva l'aspetto generale
        reperto: Febbre a 39,5 °C
      - azione: Chiede cos'è successo
        reperto: Convulsioni febbrili; i genitori hanno somministrato il Micronoan per via rettale come indicato dal pediatra
      - azione: Protezione termica
        reperto: Non copre il paziente
      - azione: Storia clinica
        reperto: Già 2 episodi convulsivi causati da un forte rialzo della temperatura corporea
  - fase: soreu
    punti: 5
    righe:
      - azione: Stato di coscienza
      - azione: Parametri rilevati
      - azione: Problemi riscontrati
      - azione: Patologie pregresse
      - azione: Manovre eseguite
  - fase: rivalutazione
    penalita: 3
    righe:
      - azione: Rivaluta l'ABCDE e monitora i parametri vitali
        reperto: "Durante il trasporto il bimbo è più contattabile: AVPU → V"
      - azione: Relazione adeguata con il paziente
      - azione: Usa presidi adeguati per il trasporto
        reperto: Presidio di ritenzione a 5 punti
  - fase: consegna
    penalita: 2
    righe:
      - azione: Consegna il paziente (PS o MSA) trasmettendo le informazioni raccolte in modo completo e corretto
