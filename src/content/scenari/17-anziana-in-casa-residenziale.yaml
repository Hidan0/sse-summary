# Scenario d'esame del corso SSE (griglia rev. 2 del 27-11-2018), riscritto in forma strutturata.
# `azione` è ciò che la griglia si aspetta dal candidato (leader), `reperto` ciò che trova o gli viene detto.
# `punti`: colonna "%" della griglia; `penalita`: il (-n) di rivalutazione e consegna.
# `filtro` e `sintesi` sono nostri: il filtro vero non è nel materiale.
# Nella griglia la casella MSA2/MSA1 non è spuntata né sul sì né sul no (`msa: null`): la SOREU invia l'MSA1 dopo la comunicazione.
numero: 17
titolo: Anziana che si lamenta in una casa residenziale
tipo: medico
categoria: "Medico acuto: cardiocircolatoria"
fonte: "scenari:33-34"
revisione: Rev. 2 del 27-11-2018
msa: null
forze-ordine: false

filtro:
  fittizio: true
  voci:
    - ["Motivo della chiamata", "Malore, si lamenta"]
    - ["Paziente", "Donna anziana"]
    - ["Luogo", "Casa residenziale, 3° piano"]
    - ["Cosciente", "Sì"]
    - ["Respira", "Sì"]

sintesi: |
  Donna anziana in una casa residenziale, seduta sul divano, con **dolore toracico oppressivo** irradiato alla gola da 40 minuti, di intensità **6**,
  in parte regredito dopo aver preso da sola 1 compressa di Carvasin sublinguale. Ha il fiato corto ("fame d'aria"), FR 22, **SpO2 90%** in aria che sale al 97% con l'O2,
  FC 80 con polso pieno e ritmico, **PA 190/101**, cute pallida e fredda. Pregresso IMA 3 anni fa, in terapia con betabloccanti, antipertensivi e cardioaspirina.

  La griglia **non** ha la riga dei segni che compromettono la sopravvivenza; quando il candidato comunica i parametri, la SOREU invia l'MSA1.

fasi:
  - fase: prearrivo
    punti: 5
    righe:
      - azione: Assegna gli incarichi
  - fase: scena
    punti: 5
    righe:
      - azione: Chiede una descrizione della scena
        reperto: Casa residenziale, è presente il personale OSS
      - azione: Colpo d'occhio
        reperto: Donna anziana seduta sul divano con gli occhi aperti
      - azione: Verifica se ci sono ostacoli al trasporto
        reperto: 3° piano
  - fase: autoprotezione
    punti: 5
    righe:
      - azione: Indossa i dispositivi di protezione individuale
  - fase: a
    punti: 10
    righe:
      - azione: Chiama il paziente, si presenta, si qualifica e lo tranquillizza
        reperto: Cosciente, si lamenta
      - azione: Verifica le vie aeree
        reperto: Vie aeree pervie
  - fase: b
    punti: 15
    righe:
      - azione: Osserva la meccanica respiratoria
        reperto: Respiro difficoltoso (affanno)
      - azione: Palpa delicatamente il torace
        reperto: Nessun dolore alla digitopressione
      - azione: Ascolta i rumori respiratori
        reperto: Nessun rumore patologico
      - azione: Conta gli atti respiratori
        reperto: FR 22 atti/min
      - azione: Misura la saturazione senza O2
        reperto: SpO2 90% in aria
      - azione: Fa mettere la maschera con O2 ad alti flussi
        reperto: Saturazione in aumento (97%)
  - fase: c
    punti: 15
    righe:
      - azione: Rileva il polso radiale
        reperto: Presente, pieno, ritmico; FC 80 battiti/min
      - azione: Valuta la cute
        reperto: Pallida, fredda
      - azione: Misura la PA
        reperto: PA 190/101
  - fase: d
    punti: 10
    righe:
      - azione: Valuta secondo l'AVPU
        reperto: Cosciente (A)
      - azione: Parla con il paziente
        reperto: Lamenta "fame d'aria"
      - azione: Valuta sensibilità e motilità
        reperto: Sensibilità e motilità conservate
  - fase: e
    punti: 10
    righe:
      - azione: Osserva l'aspetto generale
        reperto: Paziente con deambulatore
      - azione: Chiede cos'è successo
        reperto: Da 40 minuti dolore toracico oppressivo irradiato alla gola
      - azione: Valuta il dolore
        reperto: Intensità del dolore 6; parziale regressione del dolore dopo aver preso da sola 1 compressa di Carvasin sublinguale
      - azione: Protezione termica
      - azione: Storia clinica
        reperto: Pregresso IMA 3 anni fa, in terapia con betabloccanti, antipertensivi e cardioaspirina
  - fase: soreu
    punti: 5
    righe:
      - azione: Stato di coscienza
      - azione: Parametri rilevati
        reperto: Riferisce i parametri alla SOREU, che invia l'MSA1
      - azione: Problemi riscontrati
      - azione: Patologie pregresse
      - azione: Manovre eseguite
  - fase: rivalutazione
    penalita: 3
    righe:
      - azione: Rivaluta l'ABCDE e monitora i parametri vitali
      - azione: Relazione adeguata con il paziente
      - azione: Usa presidi adeguati per il trasporto
  - fase: consegna
    penalita: 2
    righe:
      - azione: Consegna il paziente (PS o MSA) trasmettendo le informazioni raccolte in modo completo e corretto
