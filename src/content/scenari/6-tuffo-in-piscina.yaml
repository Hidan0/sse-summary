# Scenario d'esame del corso SSE (griglia rev. 2 del 27-11-2018), riscritto in forma strutturata.
# `azione` è ciò che la griglia si aspetta dal candidato (leader), `reperto` ciò che trova o gli viene detto.
# `punti`: colonna "%" della griglia; `penalita`: il (-n) di rivalutazione e consegna.
# `filtro` e `sintesi` sono nostri: il filtro vero non è nel materiale.
numero: 6
titolo: Tuffo in piscina
tipo: trauma
categoria: "Infortunio: precipitato"
fonte: "scenari:11-12"
revisione: Rev. 2 del 27-11-2018
msa: false
forze-ordine: false

filtro:
  fittizio: true
  voci:
    - ["Motivo della chiamata", "Tuffo in piscina, dolore alla schiena"]
    - ["Paziente", "Donna, 35 anni"]
    - ["Luogo", "Piscina, a bordo vasca"]
    - ["Cosciente", "Sì"]
    - ["Respira", "Sì"]

sintesi: |
  Donna di 35 anni che, tuffandosi in una vasca profonda **1,5 metri**, ha sentito un forte dolore alla schiena; recuperata dagli astanti, è supina a bordo vasca e non si muove.
  Cosciente (A) e agitata, respiro superficiale con **FR 28** e **SpO2 92%** in aria (in aumento con l'O2), **FC 65**, cute pallida e bagnata, **PA 100/75**.
  Ha un **deficit di motilità agli arti inferiori** e la **sensibilità assente fino alla linea dei capezzoli**; contusione e tumefazione alla fronte.

  La griglia **non** segnala segni che compromettono la sopravvivenza e non prevede l'MSA.

fasi:
  - fase: prearrivo
    punti: 5
    righe:
      - azione: Assegna gli incarichi
  - fase: scena
    punti: 5
    righe:
      - azione: Chiede una descrizione della scena
        reperto: Donna sveglia, supina a bordo vasca, recuperata dagli astanti
      - azione: Colpo d'occhio
        reperto: Sdraiata supina, non si muove
      - azione: Verifica se ci sono ostacoli al trasporto
        reperto: Terreno erboso
      - azione: Chiede la dinamica dell'evento
        reperto: Tuffo nella vasca profonda 1,5 metri
  - fase: autoprotezione
    punti: 5
    righe:
      - azione: Indossa i dispositivi di protezione individuale
  - fase: a
    punti: 15
    righe:
      - azione: Fa immobilizzare manualmente il rachide cervicale
        grave: true
      - azione: Chiama il paziente, si presenta, si qualifica e lo tranquillizza
        reperto: Cosciente, agitata
      - azione: Verifica le vie aeree
        reperto: Vie aeree pervie
      - azione: Fa posizionare il collare cervicale
  - fase: b
    punti: 15
    righe:
      - azione: Osserva la meccanica respiratoria
        reperto: Movimenti del torace superficiali
      - azione: Palpa delicatamente il torace
        reperto: Nulla di particolare
      - azione: Ascolta i rumori respiratori
        reperto: Assenti
      - azione: Conta gli atti respiratori
        reperto: FR 28 atti/min
      - azione: Misura la saturazione senza O2
        reperto: SpO2 92% in aria
      - azione: Fa mettere la maschera con O2 ad alti flussi
        reperto: Saturazione in aumento
  - fase: c
    punti: 15
    righe:
      - azione: Osserva se ci sono emorragie esterne
        reperto: Assenti
      - azione: Rileva il polso radiale
        reperto: Presente, FC 65 battiti/min
      - azione: Valuta la cute
        reperto: Pallida e bagnata
      - azione: Misura la PA
        reperto: PA 100/75
  - fase: d
    punti: 5
    righe:
      - azione: Valuta secondo l'AVPU
        reperto: Paziente sveglia (A)
      - azione: Parla con la paziente
        reperto: Cosciente, ricorda l'accaduto
      - azione: Valuta sensibilità e motilità
        reperto: Deficit di motilità agli arti inferiori, sensibilità assente fino alla linea dei capezzoli
  - fase: e
    punti: 10
    righe:
      - azione: Osserva l'aspetto generale
        reperto: Donna spaventata e sofferente
      - azione: Chiede cos'è successo
        reperto: Riferisce di aver sentito un forte dolore alla schiena tuffandosi in piscina
      - azione: Cerca altri segni esterni
        reperto: Contusione e tumefazione alla fronte
      - azione: Valuta il dolore
      - azione: Protezione termica
      - azione: Storia clinica
        reperto: Donna di 35 anni, fumatrice, nessuna patologia
  - fase: soreu
    punti: 5
    righe:
      - azione: Stato di coscienza
      - azione: Parametri rilevati
      - azione: Problemi riscontrati
      - azione: Patologie pregresse
      - azione: Manovre eseguite
  - fase: rivalutazione
    penalita: 3
    righe:
      - azione: Rivaluta l'ABCDE e monitora i parametri vitali
      - azione: Relazione adeguata con il paziente
      - azione: Usa presidi adeguati per il trasporto
  - fase: consegna
    penalita: 2
    righe:
      - azione: Consegna il paziente (PS o MSA) trasmettendo le informazioni raccolte in modo completo e corretto
