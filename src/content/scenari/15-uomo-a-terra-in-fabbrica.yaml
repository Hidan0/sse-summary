# Scenario d'esame del corso SSE (griglia rev. 2 del 27-11-2018), riscritto in forma strutturata.
# `azione` è ciò che la griglia si aspetta dal candidato (leader), `reperto` ciò che trova o gli viene detto.
# `punti`: colonna "%" della griglia; `penalita`: il (-n) di rivalutazione e consegna.
# `filtro` e `sintesi` sono nostri: il filtro vero non è nel materiale.
numero: 15
titolo: Uomo a terra in fabbrica
tipo: medico
categoria: "Medico acuto: metabolica"
fonte: "scenari:29-30"
revisione: Rev. 2 del 27-11-2018
msa: true
forze-ordine: false

filtro:
  fittizio: true
  voci:
    - ["Motivo della chiamata", "Malore con perdita di coscienza"]
    - ["Paziente", "Uomo, adulto"]
    - ["Luogo", "Capannone di una fabbrica"]
    - ["Cosciente", "No"]
    - ["Respira", "Sì"]

sintesi: |
  Uomo di 38 anni a terra in un capannone; i colleghi riferiscono un malore, poi la perdita di coscienza.
  **Non risponde** e si muove solo allo **stimolo doloroso (P)**; espansione toracica bilaterale, FR 16, SpO2 98% in aria, FC 105,
  cute pallida, calda e con **sudorazione profusa**, PA 130/80. Prima di perdere coscienza aveva una **glicemia di 50 mg/dl**
  e i colleghi non sono riusciti a dargli dello zucchero: è **diabetico** dall'adolescenza, in terapia con insulina 3 volte al giorno.
  Spazi ristretti: la barella non passa. La SOREU manda l'MSA.

  La griglia **non** ha la riga dei segni che compromettono la sopravvivenza.

fasi:
  - fase: prearrivo
    punti: 5
    righe:
      - azione: Assegna gli incarichi
  - fase: scena
    punti: 5
    righe:
      - azione: Chiede una descrizione della scena
        reperto: Capannone di una fabbrica, uomo a terra che non si muove
      - azione: Colpo d'occhio
        reperto: I colleghi riferiscono un malore e poi la perdita di coscienza
      - azione: Verifica se ci sono ostacoli al trasporto
        reperto: Spazi ristretti (il percorso con la barella non è accessibile)
  - fase: autoprotezione
    punti: 5
    righe:
      - azione: Indossa i dispositivi di protezione individuale
  - fase: a
    punti: 10
    righe:
      - azione: Chiama il paziente, si presenta, si qualifica e lo tranquillizza
        reperto: Il paziente non risponde, respira
      - azione: Verifica le vie aeree
        reperto: Vie aeree pervie
  - fase: b
    punti: 15
    righe:
      - azione: Osserva la meccanica respiratoria
        reperto: Espansione bilaterale
      - azione: Palpa delicatamente il torace
        reperto: Nulla di evidente
      - azione: Ascolta i rumori respiratori
        reperto: Nessun rumore particolare
      - azione: Conta gli atti respiratori
        reperto: FR 16 atti/min
      - azione: Misura la saturazione senza O2
        reperto: SpO2 98% in aria
      - azione: Fa mettere la maschera con O2 ad alti flussi
        reperto: SpO2 100%
  - fase: c
    punti: 15
    righe:
      - azione: Rileva il polso radiale
        reperto: Presente, pieno, ritmico; FC 105 battiti/min
      - azione: Valuta la cute
        reperto: Pallida, calda, sudorazione profusa
      - azione: Misura la PA
        reperto: PA 130/80
  - fase: d
    punti: 10
    righe:
      - azione: Valuta secondo l'AVPU
        reperto: Incosciente, si muove allo stimolo doloroso (P)
      - azione: Parla con il paziente
      - azione: Valuta sensibilità e motilità
        reperto: Motilità conservata ai 4 arti
  - fase: e
    punti: 10
    righe:
      - azione: Osserva l'aspetto generale
        reperto: Uomo di 38 anni
      - azione: Chiede cos'è successo
        reperto: I colleghi riferiscono un malessere e una glicemia di 50 mg/dl prima della perdita di coscienza; non sono riusciti a dargli dello zucchero
      - azione: Valuta il dolore
        reperto: Non valutabile
      - azione: Protezione termica
      - azione: Storia clinica
        reperto: Diabetico dall'adolescenza, in terapia con insulina 3 volte al giorno
  - fase: soreu
    punti: 5
    righe:
      - azione: Stato di coscienza
      - azione: Parametri rilevati
      - azione: Problemi riscontrati
      - azione: Patologie pregresse
      - azione: Manovre eseguite
        reperto: La SOREU comunica che l'MSA è in arrivo
  - fase: rivalutazione
    penalita: 3
    righe:
      - azione: Rivaluta l'ABCDE e i parametri vitali
      - azione: Relazione adeguata con il paziente
      - azione: Usa presidi adeguati per il trasporto
  - fase: consegna
    penalita: 2
    righe:
      - azione: Consegna il paziente (PS o MSA) trasmettendo le informazioni raccolte in modo completo e corretto
