# Scenario d'esame del corso SSE (griglia rev. 2 del 27-11-2018), riscritto in forma strutturata.
# `azione` è ciò che la griglia si aspetta dal candidato (leader), `reperto` ciò che trova o gli viene detto.
# `punti`: colonna "%" della griglia; `penalita`: il (-n) di rivalutazione e consegna.
# `filtro` e `sintesi` sono nostri: il filtro vero non è nel materiale.
numero: 24
titolo: Uomo con affanno al quarto piano
tipo: medico
categoria: "Medico acuto: respiratoria"
fonte: "scenari:47-48"
revisione: Rev. 2 del 27-11-2018
msa: false
forze-ordine: false

filtro:
  fittizio: true
  voci:
    - ["Motivo della chiamata", "Difficoltà respiratoria"]
    - ["Paziente", "Uomo, 67 anni"]
    - ["Luogo", "Abitazione"]
    - ["Cosciente", "Sì"]
    - ["Respira", "Sì, con fatica"]

sintesi: |
  Uomo di 67 anni con **bronchite cronica (BPCO)**, in ossigenoterapia domiciliare al bisogno e ricoverato un mese fa per polmonite.
  La difficoltà respiratoria dura da qualche giorno ed è aumentata da circa 2 ore, con tosse continua.
  È cosciente (A) ma parla a fatica, respira a **32 atti/min** con i muscoli accessori e rantoli quando tossisce, **SpO2 85%** in aria
  (**92%** con l'O2); FC **140** con polso flebile, cute sudata e fredda con cianosi labiale, **PA 180/100**, edemi declivi.
  Abita al 4° piano senza ascensore.

  La griglia non ha la riga dei segni che compromettono la sopravvivenza e non prevede l'arrivo dell'MSA.

fasi:
  - fase: prearrivo
    punti: 5
    righe:
      - azione: Assegna gli incarichi
  - fase: scena
    punti: 5
    righe:
      - azione: Chiede una descrizione della scena
        reperto: Uomo seduto in casa sua; la moglie riferisce difficoltà respiratoria da qualche giorno
      - azione: Colpo d'occhio
        reperto: Cosciente, con evidente dispnea
      - azione: Verifica se ci sono ostacoli al trasporto
        reperto: 4° piano senza ascensore
  - fase: autoprotezione
    punti: 5
    righe:
      - azione: Indossa i dispositivi di protezione individuale
  - fase: a
    punti: 10
    righe:
      - azione: Chiama il paziente, si presenta, si qualifica e lo tranquillizza
        reperto: Cosciente, parla a fatica per l'affanno
      - azione: Verifica le vie aeree
        reperto: Vie aeree pervie
  - fase: b
    punti: 15
    righe:
      - azione: Osserva la meccanica respiratoria
        reperto: Bilaterale, tachipnoico, usa i muscoli accessori
      - azione: Palpa delicatamente il torace
        reperto: Nessun dolore alla palpazione
      - azione: Ascolta i rumori respiratori
        reperto: Quando tossisce, rumori tipo rantolo
      - azione: Conta gli atti respiratori
        reperto: FR 32 atti/min
      - azione: Misura la saturazione senza O2
        reperto: SpO2 85% in aria
      - azione: Fa mettere la maschera con O2 (almeno 8 litri)
        reperto: Con l'O2 la saturazione sale al 92%
  - fase: c
    punti: 15
    righe:
      - azione: Rileva il polso radiale
        reperto: Presente, flebile, regolare; FC 140 battiti/min
      - azione: Valuta la cute
        reperto: Sudata e fredda, cianosi labiale
      - azione: Misura la PA
        reperto: PA 180/100
  - fase: d
    punti: 10
    righe:
      - azione: Valuta secondo l'AVPU
        reperto: Paziente (A)
      - azione: Parla con il paziente
        reperto: Cosciente, riferisce fame d'aria, fa fatica a parlare
      - azione: Valuta sensibilità e motilità
        reperto: Conservate ai 4 arti
  - fase: e
    punti: 10
    righe:
      - azione: Osserva l'aspetto generale
        reperto: Uomo di 67 anni, edemi declivi
      - azione: Chiede cos'è successo
        reperto: Da circa 2 ore la difficoltà respiratoria è aumentata, tosse continua
      - azione: Valuta il dolore
        reperto: Non lamenta dolore
      - azione: Storia clinica
        reperto: Bronchite cronica (BPCO), ossigenoterapia domiciliare al bisogno; ricoverato un mese fa per polmonite
      - azione: Protezione termica
  - fase: soreu
    punti: 5
    righe:
      - azione: Stato di coscienza
      - azione: Parametri rilevati
      - azione: Problemi riscontrati
      - azione: Patologie pregresse
      - azione: Manovre eseguite
  - fase: rivalutazione
    penalita: 3
    righe:
      - azione: Rivaluta l'ABCDE e i parametri vitali
      - azione: Relazione adeguata con il paziente
      - azione: Usa presidi adeguati per il trasporto
  - fase: consegna
    penalita: 2
    righe:
      - azione: Consegna il paziente (PS o MSA) trasmettendo le informazioni raccolte in modo completo e corretto
