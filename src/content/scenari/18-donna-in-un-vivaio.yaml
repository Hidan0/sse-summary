# Scenario d'esame del corso SSE (griglia rev. 2 del 27-11-2018), riscritto in forma strutturata.
# `azione` è ciò che la griglia si aspetta dal candidato (leader), `reperto` ciò che trova o gli viene detto.
# `punti`: colonna "%" della griglia; `penalita`: il (-n) di rivalutazione e consegna.
# `filtro` e `sintesi` sono nostri: il filtro vero non è nel materiale.
numero: 18
titolo: Donna con difficoltà respiratoria in un vivaio
tipo: medico
categoria: "Medico acuto: respiratoria"
fonte: "scenari:35-36"
revisione: Rev. 2 del 27-11-2018
msa: false
forze-ordine: false

filtro:
  fittizio: true
  voci:
    - ["Motivo della chiamata", "Difficoltà respiratoria"]
    - ["Paziente", "Donna"]
    - ["Luogo", "Vivaio"]
    - ["Cosciente", "Sì"]
    - ["Respira", "Sì, con fatica"]

sintesi: |
  Donna di 62 anni, asmatica in terapia, in piedi appoggiata a una sedia in un vivaio, agitata, con **importante difficoltà respiratoria** ingravescente da circa 20 minuti,
  senza miglioramento dopo 2 puff di Ventolin. Parla a fatica e non riesce a finire le frasi; sibili espiratori, **FR 30**, **SpO2 86%** in aria che sale al 90% con l'O2,
  FC 115, PA 160/90, cute sudata e pallida. È anche ipertesa e diabetica in terapia orale.

  La griglia **non** ha la riga dei segni che compromettono la sopravvivenza e non prevede l'MSA.

fasi:
  - fase: prearrivo
    punti: 5
    righe:
      - azione: Assegna gli incarichi
  - fase: scena
    punti: 5
    righe:
      - azione: Chiede una descrizione della scena
        reperto: Donna all'interno di un vivaio, agitata, in piedi appoggiata a una sedia
      - azione: Colpo d'occhio
        reperto: Difficoltà respiratoria
      - azione: Verifica se ci sono ostacoli al trasporto
        reperto: Nessun ostacolo
  - fase: autoprotezione
    punti: 5
    righe:
      - azione: Indossa i dispositivi di protezione individuale
  - fase: a
    punti: 10
    righe:
      - azione: Chiama il paziente, lo tranquillizza, si presenta e si qualifica
        reperto: Cosciente, agitata, con importante difficoltà respiratoria
      - azione: Verifica le vie aeree
        reperto: Vie aeree pervie
  - fase: b
    punti: 15
    righe:
      - azione: Osserva la meccanica respiratoria
        reperto: Meccanica bilaterale, dispnoica
      - azione: Palpa delicatamente il torace
        reperto: Nessun dolore alla palpazione
      - azione: Ascolta i rumori respiratori
        reperto: Sibili espiratori
      - azione: Conta gli atti respiratori
        reperto: FR 30 atti/min
      - azione: Misura la saturazione senza O2
        reperto: SpO2 86% in aria
      - azione: Fa mettere la maschera con O2 ad alti flussi
        reperto: Saturazione in aumento (90%)
  - fase: c
    punti: 15
    righe:
      - azione: Rileva il polso radiale
        reperto: Presente, tachicardico, regolare; FC 115 battiti/min
      - azione: Valuta la cute
        reperto: Sudata, pallida
      - azione: Misura la PA
        reperto: PA 160/90
  - fase: d
    punti: 10
    righe:
      - azione: Valuta secondo l'AVPU
        reperto: A
      - azione: Parla con il paziente
        reperto: Cosciente, parla a fatica, non riesce a finire le frasi
      - azione: Valuta sensibilità e motilità
        reperto: Nessun deficit motorio e sensitivo
  - fase: e
    punti: 10
    righe:
      - azione: Osserva l'aspetto generale
        reperto: Donna sovrappeso
      - azione: Chiede cos'è successo
        reperto: Dispnea ingravescente da circa 20 minuti, nessun miglioramento dopo aver preso 2 puff di Ventolin spray
      - azione: Valuta il dolore
        reperto: Non lamenta dolore
      - azione: Storia clinica
        reperto: Donna di 62 anni, asmatica in terapia; ipertensione, diabetica in terapia orale
      - azione: Protezione termica
  - fase: soreu
    punti: 5
    righe:
      - azione: Stato di coscienza
      - azione: Parametri rilevati
      - azione: Problemi riscontrati
      - azione: Patologie pregresse
      - azione: Manovre eseguite
  - fase: rivalutazione
    penalita: 3
    righe:
      - azione: Rivaluta l'ABCDE e monitora i parametri vitali
      - azione: Relazione adeguata con il paziente
      - azione: Usa presidi adeguati per il trasporto
  - fase: consegna
    penalita: 2
    righe:
      - azione: Consegna il paziente (PS o MSA) trasmettendo le informazioni raccolte in modo completo e corretto
